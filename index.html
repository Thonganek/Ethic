/* ---------- review state ---------- */
function formKeyFor(p) {
  return S.user.memberType === 'layperson' ? 'AF04' : TYPES[p.reviewType].form;
}
function blankData() {
  return { answers: {}, risk: '', reportPeriod: '', opinion: '', opinionReason: '', suggestType: '', other: '', step: 0 };
}
function mergeData(base, d) {
  d = d || {};
  Object.keys(base).forEach(function (k) {
    if (d[k] !== undefined && d[k] !== null) base[k] = d[k];
  });
  // ข้อมูลตอบรับ/ประเภทการพิจารณาจากแบบประเมินรุ่นก่อน เก็บไว้ตามเดิมโดยไม่แก้ไข
  ['accept', 'cls'].forEach(function (k) {
    if (d[k] && typeof d[k] === 'object') base[k] = d[k];
  });
  if (typeof base.answers !== 'object' || !base.answers) base.answers = {};
  return base;
}
function rateables(form) {
  var out = [];
  form.sections.forEach(function (sec) {
    sec.items.forEach(function (it) {
      if (it.subs) it.subs.forEach(function (s) { out.push({ id: s.id, no: s.no, title: s.title, desc: s.desc, note: s.note, sec: sec, parent: it }); });
      else out.push({ id: it.id, no: it.no, title: it.title, desc: it.desc, note: it.note, ref: it.ref, sec: sec, parent: null });
    });
  });
  return out;
}
function itemLabel(r) {
  return (r.parent ? r.parent.title + ' – ' : '') + r.title;
}
function secLabel(sec) {
  return sec.title + (sec.th ? ' (' + sec.th + ')' : '');
}
function stepsOf() {
  return [{ k: 'evaluate', t: 'ประเมินรายข้อ' }, { k: 'conclude', t: 'สรุปความเห็น' }, { k: 'confirm', t: 'ตรวจทานและส่ง' }];
}
function draftKey(pid) { return 'draft.' + S.user.username + '.' + pid; }
function keepLocalDraft() {
  var rv = S.review;
  if (!rv || !rv.dirty || !S.user) return;
  rv.data.step = rv.step;
  store.set(draftKey(rv.project.id), JSON.stringify({ ts: Date.now(), data: rv.data }));
}
var draftTimer = null;
function touch() {
  if (!S.review) return;
  S.review.dirty = true;
  S.review.rev = (S.review.rev || 0) + 1;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(keepLocalDraft, 500);
}
function reviewLocked(rv) { return rv.project.status === 'closed'; }

LOAD.review = function (pid) {
  if (isAdmin()) return Promise.reject(new Error('บัญชีผู้ดูแลระบบใช้สำหรับจัดการโครงการ ไม่สามารถกรอกแบบประเมินได้'));
  return Promise.all([api('getReview', { projectId: pid }), loadProjects()]).then(function (r) {
    var res = r[0], p = res.project;
    var data = mergeData(blankData(p), res.review && res.review.data);
    var local = store.json(draftKey(pid), null);
    var restored = false;
    if (local && local.data && (!res.review || local.ts > Date.parse(res.review.updatedAt))) {
      data = mergeData(blankData(p), local.data);
      restored = true;
    }
    var rv = {
      project: p, form: FORMS[formKeyFor(p)], data: data, status: res.review ? res.review.status : '',
      savedAt: res.review ? res.review.updatedAt : '', dirty: restored, showMissing: false, step: 0
    };
    var last = stepsOf(rv).length - 1;
    rv.step = rv.status === 'submitted' ? last : Math.max(0, Math.min(Number(data.step) || 0, last));
    S.review = rv;
    if (restored) toast('กู้คืนข้อมูลที่ยังไม่ได้บันทึกจากเครื่องนี้แล้ว');
  });
};

/* ---------- validation ---------- */
function problems(rv, only) {
  var d = rv.data, out = [];
  var add = function (step, msg, target) { if (!only || only === step) out.push({ step: step, msg: msg, target: target || '' }); };
  rateables(rv.form).forEach(function (r) {
    var a = d.answers[r.id];
    if (!a || !a.r) add('evaluate', 'ยังไม่ได้ประเมิน: ' + secLabel(r.sec) + ' ข้อ ' + r.no, r.id);
    else if (a.r === 'no' && !String(a.c || '').trim()) add('evaluate', 'ยังไม่ได้ระบุข้อเสนอแนะ: ' + secLabel(r.sec) + ' ข้อ ' + r.no, r.id);
  });
  if (rv.form.risk === 'required' && !d.risk) add('conclude', 'ยังไม่ได้ประเมินความเสี่ยงของโครงการ');
  if (rv.form.report === 'required' && !d.reportPeriod) add('conclude', 'ยังไม่ได้ระบุระยะเวลาการรายงานความก้าวหน้า');
  var op = byValue(rv.form.opinions, d.opinion);
  if (rv.form.suggest && !TYPES[d.suggestType]) add('conclude', 'ยังไม่ได้ระบุประเภทการพิจารณาที่เห็นควร');
  if (!op) add('conclude', 'ยังไม่ได้สรุปความเห็นโดยรวม');
  else if (op.reason && !String(d.opinionReason).trim()) add('conclude', 'กรุณาระบุเหตุผลประกอบความเห็น');
  return out;
}
function counts(rv) {
  var list = rateables(rv.form), rated = 0, no = 0;
  list.forEach(function (r) {
    var a = rv.data.answers[r.id];
    if (a && a.r) { rated++; if (a.r === 'no') no++; }
  });
  return { total: list.length, rated: rated, no: no };
}
function flatComments(form, data) {
  var out = [];
  rateables(form).forEach(function (r) {
    var a = data.answers[r.id];
    if (!a || !a.r) return;
    var c = String(a.c || '').trim();
    if (a.r !== 'no' && !c) return;
    out.push({ id: r.id, section: secLabel(r.sec), item: r.no + ' ' + itemLabel(r), rating: RATINGS[a.r].th, r: a.r, comment: c });
  });
  return out;
}
function criteriaText(ids) {
  var top = {};
  (ids || []).forEach(function (id) {
    var m = /^[XEF](\d+)(?:\.(\d+))?$/.exec(id);
    if (!m) return;
    top[m[1]] = top[m[1]] || [];
    if (m[2]) top[m[1]].push(m[1] + '.' + m[2]);
  });
  return Object.keys(top).sort(function (a, b) { return a - b; }).map(function (k) {
    return 'ข้อ ' + k + (top[k].length ? ' (' + top[k].join(', ') + ')' : '');
  }).join(', ');
}

/* ---------- review view ---------- */

      (acc.note ? '<div class="pre small">' + esc(acc.note) + '</div>' : '') +

  } else if (!reviewLocked(rv) && rv.status !== 'submitted') {

    '<div class="actionbar"><div class="wrap actionbar-in" id="actionbar">' + actionBar(rv) + '</div></div>';

function stepBody(rv) {
  var k = stepsOf(rv)[rv.step].k;
  var probs = rv.showMissing ? problems(rv, k === 'confirm' ? null : k) : [];
  var head = '';
  if (probs.length && k !== 'evaluate' && k !== 'confirm') {
    head = '<div class="note bad" style="margin-bottom:14px" role="alert">' + icon('alert') + '<div><b>กรุณาตรวจสอบ</b><ul class="g-list">' +
      probs.map(function (x) { return '<li>' + esc(x.msg) + '</li>'; }).join('') + '</ul></div></div>';
  }
  return head + { evaluate: stepEvaluate, conclude: stepConclude, confirm: stepConfirm }[k](rv);
}

function actionBar(rv) {
  var steps = stepsOf(rv), last = rv.step === steps.length - 1, c = counts(rv);
  var html = '<span class="progress-txt">ประเมินแล้ว <b>' + c.rated + '/' + c.total + '</b> ข้อ' + (c.no ? ' · ไม่เหมาะสม ' + c.no + ' ข้อ' : '') +

  if (rv.step > 0) html += '<button class="btn ghost" data-act="step" data-step="' + (rv.step - 1) + '">' + icon('left') + 'ย้อนกลับ</button>';
  if (reviewLocked(rv)) return html + (last ? '' : '<button class="btn" data-act="step" data-step="' + (rv.step + 1) + '">ถัดไป' + icon('right') + '</button>');
  if (rv.status !== 'submitted') html += '<button class="btn ghost" data-act="save-draft">บันทึกร่าง</button>';
  if (!last) html += '<button class="btn" data-act="next">ถัดไป' + icon('right') + '</button>';
  else html += '<button class="btn" data-act="submit-review">' + icon('send') + (rv.status === 'submitted' ? 'บันทึกการแก้ไข' : 'ส่งผลการประเมิน') + '</button>';

}
function refreshBar() {
  var el = $('#actionbar');

}

}

function radios(path, options, value, cols) {

      (o.rerender ? ' data-rerender="1"' : '') + (on ? ' checked' : '') + '><span><b>' + esc(o.t) + '</b>' +

}
function textarea(path, value, placeholder, rows) {

/* ---------- ขั้นที่ 1: ประเมินรายข้อ ---------- *//* ---------- step 3: ประเมินรายข้อ ---------- */
function qRow(r, rv, sub) {
  var a = rv.data.answers[r.id] || {};
  var missing = rv.showMissing && (!a.r || (a.r === 'no' && !String(a.c || '').trim()));
  var showComment = a.r === 'no' || !!String(a.c || '').trim();

}
function secCount(sec, rv) {

}
function stepEvaluate(rv) {

/* ---------- ขั้นที่ 3: ตรวจทานและส่ง ---------- */

  }
  var op = byValue(f.opinions, d.opinion), risk = byValue(RISKS, d.risk), rep = byValue(REPORTS, d.reportPeriod);
  html += '<section class="card"><div class="card-head"><h3>สรุปผลการประเมินของท่าน</h3>' +
    '<button class="btn ghost sm" data-act="print-my-review">' + icon('print') + 'พิมพ์แบบประเมิน</button></div><div class="card-body"><dl class="kv">' +
    '<dt>ผู้ประเมิน</dt><dd>' + esc(S.user.fullName) + '</dd>' +

/* ---------- review interactions ---------- */
function setPath(obj, path, value) {
  var parts = path.split('.');
  for (var i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
  obj[parts[parts.length - 1]] = value;
}
function onBind(el) {
  var rv = S.review;
  if (!rv || S.view !== 'review' || reviewLocked(rv)) return;
  setPath(rv.data, el.dataset.bind, el.value);
  touch();
  if (el.type === 'radio') {
    $$('.choice', el.closest('.choices')).forEach(function (c) { c.classList.toggle('on', $('input', c).checked); });
    if (el.dataset.rerender) {
      refreshStep();
      return;
    }
  }
  refreshBar();
}
function onComment(el) {
  var rv = S.review;
  if (!rv || reviewLocked(rv)) return;
  var q = el.closest('.q'), id = q.dataset.q;
  var a = rv.data.answers[id] = rv.data.answers[id] || { r: '', c: '' };

function gotoStep(i, target) {
  var rv = S.review;
  rv.step = Math.max(0, Math.min(i, stepsOf(rv).length - 1));
  rv.data.step = rv.step;
  rv.showMissing = !!target || rv.showMissing;
  render();
  var el = target && document.getElementById('q-' + target);
  if (el) {
    el.scrollIntoView({ block: 'center' });
    var ta = $('textarea', el);
    if (ta && !$('.q-cbox', el).hidden) ta.focus({ preventScroll: true });
  } else {
    var st = $('.stepper');
    if (st) window.scrollTo(0, Math.max(0, st.getBoundingClientRect().top + window.pageYOffset - 70));
  }
}
A['step'] = function (el) {
  var rv = S.review;
  var i = Number(el.dataset.step);
  rv.showMissing = false;
  gotoStep(i);
  autoSave();
};
A['jump'] = function (el) { gotoStep(Number(el.dataset.step), el.dataset.target); };
A['next'] = function () {
  var rv = S.review, k = stepsOf(rv)[rv.step].k;
  var probs = problems(rv, k);
  if (probs.length) {
    rv.showMissing = true;
    refreshStep();
    toast(k === 'evaluate' ? 'ยังมี ' + probs.length + ' ข้อที่ยังไม่ครบถ้วน' : probs[0].msg, 'bad');
    var first = probs[0].target && document.getElementById('q-' + probs[0].target);
    if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
    else window.scrollTo(0, Math.max(0, $('.stepper').getBoundingClientRect().top + window.pageYOffset - 70));
    return;
  }
  rv.showMissing = false;
  gotoStep(rv.step + 1);
  autoSave();
};

function sendReview(status) {
  var rv = S.review, rev = rv.rev;
  rv.data.step = rv.step;
  if (status !== 'declined') delete rv.data.accept;
  return api('saveReview', {
    projectId: rv.project.id, formType: rv.form.key, status: status, data: rv.data,
    comments: status === 'draft' ? [] : flatComments(rv.form, rv.data).concat(
      rv.data.other ? [{ section: 'ข้อเสนอแนะอื่น ๆ', item: '', rating: '', comment: rv.data.other }] : [])
  }).then(function (res) {
    rv.status = res.review.status;
    rv.savedAt = res.review.updatedAt;
    // ถ้ามีการพิมพ์เพิ่มระหว่างรอเซิร์ฟเวอร์ ให้คงสถานะ "ยังไม่ได้บันทึก" ไว้
    if (rv.rev === rev) {
      rv.dirty = false;
      clearTimeout(draftTimer);
      store.del(draftKey(rv.project.id));
    }
    S.projects = null;
    return res;
  });
}

function opinionsFor(type) { return type === 'exempt' ? OPINIONS_EXEMPT : OPINIONS_STD; }
function opinionOf(review) {
  var f = FORMS[review.formType];
  return f ? byValue(f.opinions, review.opinion || (review.data || {}).opinion) : null;
}
function submittedOf(ov) { return ov.reviews.filter(function (r) { return r.status === 'submitted'; }); }

/** เรียงหมวดและข้อประเมินตามแบบฟอร์มที่กรรมการใช้จริงในโครงการนี้ */
function overviewItems(ov) {
  var seen = {}, out = [], used = [];
  submittedOf(ov).forEach(function (rv) { if (FORMS[rv.formType] && used.indexOf(rv.formType) < 0) used.push(rv.formType); });
  // ใช้เลขข้อของแบบฟอร์มหลักของโครงการก่อน แล้วจึงเติมข้อที่มีเฉพาะในแบบอื่น
  var main = TYPES[ov.project.reviewType] ? TYPES[ov.project.reviewType].form : '';
  used.sort(function (a, b) { return (a === main ? 0 : 1) - (b === main ? 0 : 1); });
  used.forEach(function (key) {
    rateables(FORMS[key]).forEach(function (r) {
      if (seen[r.id]) return;
      seen[r.id] = true;
      out.push(r);
    });
  });
  var order = ['sv', 'ei', 'ic', 'qi'];
  var rank = function (r) { var i = order.indexOf(r.sec.id); return r.sec.id === 'ex' ? 100 : (i < 0 ? 99 : i); };
  return out.sort(function (a, b) { return rank(a) - rank(b); });
}
function suggestOf(rv) {
  var d = rv.data || {};
  if (TYPES[d.suggestType]) return d.suggestType;
  return d.cls && TYPES[d.cls.type] && (d.cls.criteria || []).length ? d.cls.type : '';
}
function groupedComments(ov) {
  var subs = submittedOf(ov), groups = [];
  overviewItems(ov).forEach(function (r) {
    var list = [];
    subs.forEach(function (rv, i) {
      var a = ((rv.data || {}).answers || {})[r.id];
      if (!a || !a.r) return;
      var c = String(a.c || '').trim();
      if (a.r !== 'no' && !c) return;
      list.push({ idx: i + 1, name: rv.reviewerName, r: a.r, c: c });
    });
    if (list.length) groups.push({ item: r, list: list });
  });
  return groups;
}

    if (c && c.type === p.reviewType) (c.criteria || []).forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
  });

A['sum-pull'] = function () {

      var text = String(pair[0] || '').trim();
      if (!text || has(text)) return;

      added++;
    });
  });
  if (!added) return toast(pts.length ? 'ข้อเสนอแนะของกรรมการถูกดึงมาครบแล้ว' : 'ยังไม่มีข้อเสนอแนะจากกรรมการ');
  sumTouch(true);
  toast('ดึงข้อเสนอแนะมา ' + added + ' ข้อ — แก้ไขถ้อยคำ รวมข้อที่ซ้ำ แล้วกดบันทึกสรุป');

A['point-down'] = function (el) {

function shareBase() {

function shareLink(p) {

}
function qrMatrix(text) {
  var qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  return qr;
}
function qrSvg(text) {
  var qr = qrMatrix(text), n = qr.getModuleCount(), m = 4, size = n + m * 2, d = '';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges" role="img" aria-label="QR Code">' +
    '<rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
function qrPng(text, scale) {
  var qr = qrMatrix(text), n = qr.getModuleCount(), m = 4, size = (n + m * 2) * scale;
  var cv = document.createElement('canvas');
  cv.width = cv.height = size;
  var ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect((c + m) * scale, (r + m) * scale, scale, scale);
  return cv.toDataURL('image/png');
}

  }, fail);

F['user-pass'] = function (form, d) {

  var u = findUser(el.dataset.id), suspend = u.status === 'active';

    title: suspend ? 'ระงับบัญชี' : 'เปิดใช้งานบัญชี',
    text: suspend ? u.fullName + ' จะไม่สามารถเข้าสู่ระบบได้จนกว่าจะเปิดใช้งานอีกครั้ง' : 'เปิดให้ ' + u.fullName + ' เข้าสู่ระบบได้อีกครั้ง',

  var u = findUser(el.dataset.id);

F['settings'] = function (form, d, btn) {
  ['overviewOpen', 'emailEnabled', 'backupEnabled'].forEach(function (k) { d[k] = form.elements[k].checked; });
  busy(btn, api('saveSettings', { settings: d })).then(function (res) {
    S.settings = res.settings;
    S.system = res.system || S.system;
    return loadProjects(true).then(function () { render(); toast('บันทึกการตั้งค่าเรียบร้อย'); });
  }, fail);
};
A['maint'] = function (el) {
  busy(el, api('maintenance', { task: el.dataset.task })).then(function (res) {
    S.system = res.system || S.system;
    var panel = $('#sys-panel');
    if (panel) panel.innerHTML = sysPanel();
    toast(res.message);
  }, fail);
};

LOAD.logs = function () {
  S.logQ = '';
  return api('listLogs', { limit: 500 }).then(function (res) { S.logs = res.logs; S.logTotal = res.total; });
};
function logTable() {
  var q = (S.logQ || '').trim().toLowerCase();
  var list = (S.logs || []).filter(function (l) {
    if (!q) return true;
    return [l.name, l.username, (LOG_LABELS[l.action] || [l.action])[0], l.target, l.detail].join(' ').toLowerCase().indexOf(q) >= 0;
  });
  if (!list.length) return '<div class="empty"><p>' + (q ? 'ไม่พบรายการที่ตรงกับคำค้น' : 'ยังไม่มีประวัติการใช้งาน') + '</p></div>';
  return '<div class="table-wrap"><table class="tbl cards"><thead><tr><th>วันเวลา</th><th>ผู้ดำเนินการ</th><th>เหตุการณ์</th><th>เกี่ยวกับ</th><th>รายละเอียด</th></tr></thead><tbody>' +
    list.map(function (l) {
      var lab = LOG_LABELS[l.action] || [l.action, ''];
      return '<tr><td data-th="วันเวลา" class="nowrap small">' + esc(fmtDateTime(l.time)) + '</td>' +
        '<td data-th="ผู้ดำเนินการ">' + esc(l.name || '–') + (l.username ? '<div class="small muted">' + esc(l.username) + '</div>' : '') + '</td>' +
        '<td data-th="เหตุการณ์" class="t-main">' + chip(lab[0], lab[1]) + '</td>' +
        '<td data-th="เกี่ยวกับ" class="pre">' + esc(l.target) + '</td>' +
        '<td data-th="รายละเอียด" class="pre small">' + esc(l.detail) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function gBlocks(blocks) {
  return blocks.map(function (b) {
    if (b.kind === 'note') return '<div class="g-block g-note">' + esc(b.text) + '</div>';
    if (b.kind === 'lead') return '<p style="color:var(--ink-2);margin-top:4px">' + esc(b.text) + '</p>';
    return '<div class="g-block g-l' + b.lvl + '"><span class="g-mark">' + esc(b.mark || '') + '</span><span>' + esc(b.text) + '</span></div>';
  }).join('');
}

  }).join('');

  }

});

document.addEventListener('input', function (ev) {

  else if (ds.filter !== undefined) onFilter(el);
});

  var el = ev.target, ds = el.dataset || {};
  if (el.tagName !== 'SELECT' && el.type !== 'radio' && el.type !== 'checkbox') return;
  if (ds.bind !== undefined) onBind(el);

  }

    if (!f.name || f.disabled || ((f.type === 'checkbox' || f.type === 'radio') && !f.checked)) return;

  $('#app').innerHTML = '<div class="auth">' + authBg() + '<div class="splash"><div><div class="emblem">' + EMBLEM + '</div>' +
    '<h3>' + (retry ? 'เชื่อมต่อระบบไม่สำเร็จ' : 'จริยธรรม มหาวิทยาลัยราชภัฏร้อยเอ็ด') + '</h3>' +

    '</div></div></div>';
}

  splash();

    S.invite = String(params.p || '').trim().toUpperCase().slice(0, 20);
    if (!IN_GAS && !apiUrl()) {
      S.view = 'setup';
      $('#app').innerHTML = '';
      return render();
    }
    S.token = store.get('token') || '';
    return api('publicInfo', {}).then(function (pub) {
      S.pub = pub;
      var showAuth = function () {
        S.token = '';
        store.del('token');
        S.view = 'auth';
        S.authTab = 'login';
        $('#app').innerHTML = '';
        render();
      };
      if (!S.token) return showAuth();
      return api('me').then(function (res) {
        S.user = res.user;
        enterApp();
      }, showAuth);
    }, function (e) {
      if (!IN_GAS && !(window.APP_CONFIG && APP_CONFIG.GAS_URL)) {
        S.error = e;
        S.view = 'setup';
        $('#app').innerHTML = '';
        return render();
      }
      splash(e.message, true);
    });
  });
}

<style>
:root {
  color-scheme: light;
  --bg: #f2f5f4;
  --surface: #ffffff;
  --surface-2: #f7f9f8;
  --ink: #14211f;
  --ink-2: #4a5955;
  --muted: #76857f;
  --line: #dde4e1;
  --line-2: #c5d0cc;
  --brand: #0e6b64;
  --brand-dark: #0a4f4a;
  --brand-deep: #073b38;
  --brand-soft: #e1f0ee;
  --brand-softer: #f1f8f7;
  --gold: #c2913a;
  --good: #0ca30c;
  --good-ink: #0a6210;
  --good-soft: #e5f5e5;
  --good-track: #cdeccd;
  --warn: #fab219;
  --warn-ink: #7d5200;
  --warn-soft: #fff3d6;
  --bad: #d03b3b;
  --bad-ink: #a32626;
  --bad-soft: #fdebeb;
  --info: #2a78d6;
  --info-ink: #1c5cab;
  --info-soft: #e6f0fc;
  --info-track: #cde2fb;
  --na-soft: #edf0ef;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(20, 33, 31, .05), 0 4px 14px rgba(20, 33, 31, .05);
  --shadow-lg: 0 10px 40px rgba(7, 59, 56, .22);
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", "Sarabun", Tahoma, system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.4; font-weight: 600; }
p { margin: 0; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.nowrap { white-space: nowrap; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 0; min-width: 0; }
.stack > * + * { margin-top: 16px; }
.stack-sm > * + * { margin-top: 8px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 18px; border-radius: 10px; border: 1px solid transparent;
  background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .15s, box-shadow .15s, transform .05s;
}
.btn:hover { background: var(--brand-dark); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .seg-btn:focus-visible, .choice:focus-within, .tab:focus-visible, .nav-item:focus-visible, .link-btn:focus-visible {
  outline: 3px solid rgba(14, 107, 100, .35); outline-offset: 2px;
}
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--brand); color: var(--brand-dark); }
.btn.soft { background: var(--brand-soft); color: var(--brand-dark); }
.btn.soft:hover { background: #d2e8e5; }
.btn.danger { background: var(--surface); color: var(--bad-ink); border-color: #ecc3c3; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: .9rem; border-radius: 8px; }
.btn.block { width: 100%; }
.btn.loading { position: relative; color: transparent !important; pointer-events: none; }
.btn.loading::after {
  content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .5); border-top-color: #fff; animation: spin .7s linear infinite;
}
.btn.ghost.loading::after, .btn.soft.loading::after, .btn.danger.loading::after { border-color: rgba(14, 107, 100, .25); border-top-color: var(--brand); }
.link-btn { background: none; border: 0; padding: 4px 2px; color: var(--brand); font-weight: 500; cursor: pointer; border-radius: 6px; display: inline-flex; gap: 6px; align-items: center; }
.link-btn:hover { text-decoration: underline; }
.icon-btn { width: 38px; height: 38px; min-height: 0; padding: 0; border-radius: 9px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Forms ---------- */
.field { display: block; }
.field > .label { display: block; font-weight: 500; font-size: .93rem; margin-bottom: 4px; color: var(--ink); }
.field .hint { display: block; font-size: .82rem; color: var(--muted); margin-top: 4px; }
.req { color: var(--bad-ink); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--surface); transition: border-color .15s, box-shadow .15s;
}
.textarea { min-height: 92px; resize: vertical; line-height: 1.6; display: block; }
.input:focus, .select:focus, .textarea:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14, 107, 100, .16); }
.input.invalid, .textarea.invalid { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(208, 59, 59, .12); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 22px; }
.card-head { padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.card-head h3 { font-size: 1.05rem; }
.card-body { padding: 20px 22px; }
.page-head { padding: 28px 0 18px; display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.page-head h1 { font-size: 1.55rem; letter-spacing: -.005em; }
.page-head p { color: var(--ink-2); margin-top: 2px; }
.eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .06em; color: var(--brand); text-transform: uppercase; }
.note { border-radius: var(--radius-sm); padding: 12px 14px; background: var(--brand-softer); border: 1px solid #cfe5e2; color: var(--ink); display: flex; gap: 10px; align-items: flex-start; font-size: .93rem; }
.note .ico { margin-top: .25em; color: var(--brand); }
.note.warn { background: var(--warn-soft); border-color: #f1d48a; }
.note.warn .ico { color: var(--warn-ink); }
.note.bad { background: var(--bad-soft); border-color: #efc1c1; }
.note.bad .ico { color: var(--bad-ink); }
.note.ok { background: var(--good-soft); border-color: #bfe3bf; }
.note.ok .ico { color: var(--good-ink); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .74rem; font-weight: 600; display: inline-grid; place-items: center; line-height: 1; }
.picker { max-height: 264px; overflow-y: auto; border: 1px solid var(--line-2); border-radius: 11px; background: var(--surface); }
.pick { display: flex; gap: 12px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.pick:last-child { border-bottom: 0; }
.pick:hover { background: var(--surface-2); }
.pick input { width: 18px; height: 18px; accent-color: var(--brand); flex: none; }
.pick:has(input:checked) { background: var(--brand-softer); }
.pick .c-sub { display: block; color: var(--ink-2); font-size: .85rem; }
.tbl tr.row-pending td { background: #fffaf0; }
.empty { text-align: center; padding: 48px 20px; color: var(--ink-2); }
.empty .empty-ico { width: 56px; height: 56px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: inline-grid; place-items: center; margin-bottom: 12px; }
.empty .empty-ico .ico { width: 26px; height: 26px; }

/* ---------- Chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: .82rem; font-weight: 500; background: var(--na-soft); color: var(--ink-2); white-space: nowrap; line-height: 1.7; }
.chip .ico { width: 1em; height: 1em; stroke-width: 2.4; }
.chip.good { background: var(--good-soft); color: var(--good-ink); }
.chip.bad { background: var(--bad-soft); color: var(--bad-ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn-ink); }
.chip.info { background: var(--info-soft); color: var(--info-ink); }
.chip.brand { background: var(--brand-soft); color: var(--brand-dark); }
.chip.outline { background: transparent; border: 1px solid var(--line-2); }

/* ---------- App shell ---------- */
.topbar { background: linear-gradient(100deg, var(--brand-deep), var(--brand-dark) 55%, var(--brand)); color: #fff; }
.topbar-in { display: flex; align-items: center; gap: 14px; min-height: 66px; }
.logo { width: 42px; height: 42px; border-radius: 12px; background: rgba(255, 255, 255, .13); display: grid; place-items: center; flex: none; border: 1px solid rgba(255, 255, 255, .22); }
.logo .ico { width: 24px; height: 24px; }
.brand-name { font-weight: 600; font-size: 1.02rem; line-height: 1.35; }
.brand-sub { font-size: .8rem; opacity: .82; line-height: 1.35; }
.userbox { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.user-meta { text-align: right; line-height: 1.3; }
.user-meta b { font-weight: 600; font-size: .92rem; display: block; }
.user-meta span { font-size: .78rem; opacity: .8; }
.topbar .btn.ghost { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .25); color: #fff; }
.topbar .btn.ghost:hover { background: rgba(255, 255, 255, .2); color: #fff; }
.navbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-item { display: inline-flex; align-items: center; gap: 8px; padding: 13px 14px; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; border-bottom: 3px solid transparent; }
.nav-item:hover { color: var(--brand-dark); }
.nav-item.active { color: var(--brand-dark); border-bottom-color: var(--brand); font-weight: 600; }
main { padding-bottom: 72px; }
.banner { margin-top: 18px; }

/* ---------- Auth / landing page ---------- */
@property --spin { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
.auth {
  --a-ink: #ecfffb;
  --a-ink-2: rgba(236, 255, 251, .74);
  --a-ink-3: rgba(236, 255, 251, .52);
  --a-line: rgba(255, 255, 255, .13);
  --a-glass: rgba(255, 255, 255, .055);
  --a-mint: #5eead4;
  --a-gold: #f3cd7e;
  --ink: var(--a-ink);
  --ink-2: var(--a-ink-2);
  --muted: var(--a-ink-3);
  --brand: var(--a-mint);
  --display: "Kanit", "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  color-scheme: dark;
  position: relative; isolation: isolate;
  height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
  background: #020d10; color: var(--a-ink);
}
.auth-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #07373a 0%, #03181c 52%, #020d10 100%); }
.aurora { position: absolute; border-radius: 50%; filter: blur(64px); mix-blend-mode: screen; will-change: transform; }
.aurora.a1 { width: 62vmax; height: 62vmax; left: -24vmax; top: -32vmax; background: radial-gradient(circle, rgba(20, 184, 166, .78), transparent 62%); animation: drift-a 24s ease-in-out infinite alternate; }
.aurora.a2 { width: 52vmax; height: 52vmax; right: -20vmax; top: -10vmax; background: radial-gradient(circle, rgba(37, 129, 214, .5), transparent 62%); animation: drift-b 31s ease-in-out infinite alternate; }
.aurora.a3 { width: 58vmax; height: 58vmax; left: 14vmax; bottom: -40vmax; background: radial-gradient(circle, rgba(16, 185, 129, .46), transparent 60%); animation: drift-c 27s ease-in-out infinite alternate; }
.aurora.a4 { width: 30vmax; height: 30vmax; right: 4vmax; bottom: -14vmax; background: radial-gradient(circle, rgba(243, 205, 126, .34), transparent 60%); animation: drift-a 36s ease-in-out infinite alternate-reverse; }
@keyframes drift-a { to { transform: translate3d(9vmax, 7vmax, 0) scale(1.15); } }
@keyframes drift-b { to { transform: translate3d(-11vmax, 9vmax, 0) scale(.9); } }
@keyframes drift-c { to { transform: translate3d(8vmax, -8vmax, 0) scale(1.12); } }
.auth-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse 85% 75% at 50% 30%, #000 25%, transparent 78%);
  mask-image: radial-gradient(ellipse 85% 75% at 50% 30%, #000 25%, transparent 78%);
}
.auth-spot { position: absolute; inset: 0; background: radial-gradient(560px circle at var(--mx, 72%) var(--my, 34%), rgba(94, 234, 212, .13), transparent 62%); }
.orbits { position: absolute; width: min(118vh, 1100px); aspect-ratio: 1; right: max(-260px, -18vw); top: 50%; transform: translateY(-50%); color: rgba(190, 255, 244, .2); }
.orbits .ring { fill: none; stroke: currentColor; stroke-width: 1; }
.orbits .spin { transform-origin: 400px 400px; animation: orbit 60s linear infinite; }
.orbits .spin.r2 { animation-duration: 95s; animation-direction: reverse; }
.orbits .spin.r3 { animation-duration: 140s; }
.orbits .sat { fill: var(--a-mint); filter: drop-shadow(0 0 8px var(--a-mint)); }
.orbits .sat.g { fill: var(--a-gold); filter: drop-shadow(0 0 8px var(--a-gold)); }
@keyframes orbit { to { transform: rotate(360deg); } }

.auth-top { display: flex; align-items: center; gap: 14px; padding: 22px clamp(20px, 5vw, 64px) 0; width: 100%; max-width: 1400px; margin: 0 auto; }
.emblem { width: 48px; height: 48px; border-radius: 15px; flex: none; display: grid; place-items: center; color: var(--a-mint); background: linear-gradient(145deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .03)); border: 1px solid rgba(255, 255, 255, .2); box-shadow: 0 8px 24px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .25); }
.emblem svg { width: 28px; height: 28px; }
.auth-brand { font-family: var(--display); font-weight: 600; font-size: 1.05rem; line-height: 1.35; letter-spacing: .01em; }
.auth-brand-sub { font-size: .8rem; color: var(--a-ink-2); line-height: 1.4; }
.auth-tag { margin-left: auto; font-size: .76rem; letter-spacing: .08em; color: var(--a-ink-2); padding: 6px 14px; border-radius: 999px; border: 1px solid var(--a-line); background: var(--a-glass); white-space: nowrap; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

.auth-body {
  flex: 1; min-height: 0; width: 100%; max-width: 1400px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 470px);
  grid-template-areas: "head panel" "more panel";
  grid-template-rows: auto 1fr;
  column-gap: clamp(32px, 5vw, 88px); row-gap: clamp(14px, 3.2vh, 30px); align-content: center;
  padding: clamp(12px, 3.5vh, 56px) clamp(20px, 5vw, 64px) clamp(14px, 3.5vh, 40px);
}
.hero-head { grid-area: head; align-self: end; }
.hero-more { grid-area: more; align-self: start; }
.auth-panel { grid-area: panel; align-self: center; }
.hero-pill { display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px 7px 12px; border-radius: 999px; font-size: .8rem; letter-spacing: .06em; color: var(--a-ink-2); border: 1px solid var(--a-line); background: var(--a-glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--a-mint); box-shadow: 0 0 0 0 rgba(94, 234, 212, .7); animation: live 2.2s ease-out infinite; }
@keyframes live { to { box-shadow: 0 0 0 12px rgba(94, 234, 212, 0); } }
.hero-title { font-family: var(--display); margin: clamp(6px, 2vh, 18px) 0 0; font-weight: 700; letter-spacing: -.01em; }
.hero-title .grad {
  display: block; font-size: clamp(2.6rem, min(7.6vw, 13.5vh), 7rem); line-height: 1.22; padding: .06em 0 .02em;
  background: linear-gradient(100deg, #e6fff9 0%, #7ff5e1 28%, #34d399 55%, #f3cd7e 85%, #fff3d6 100%);
  background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 6px 38px rgba(94, 234, 212, .32)); animation: sheen 9s ease-in-out infinite alternate;
}
@keyframes sheen { to { background-position: 100% 0; } }
.hero-title .uni { display: block; white-space: nowrap; font-size: clamp(1.3rem, min(3.1vw, 5.9vh), 3.05rem); font-weight: 500; line-height: 1.4; color: #fff; margin-top: -.1em; }
.hero-lead { margin-top: clamp(8px, 1.8vh, 16px); max-width: 36em; font-size: clamp(1rem, 1.25vw, 1.12rem); color: var(--a-ink-2); line-height: 1.8; }

.principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pr { position: relative; padding: 16px 16px 15px; border-radius: 18px; border: 1px solid var(--a-line); background: linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .025)); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transition: transform .25s, border-color .25s, box-shadow .25s; }
.pr:hover { transform: translateY(-4px); border-color: rgba(94, 234, 212, .5); box-shadow: 0 18px 40px -18px rgba(45, 212, 191, .55); }
.pr-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #032624; background: linear-gradient(135deg, #a7f9ea, #2dd4bf); box-shadow: 0 6px 18px -4px rgba(45, 212, 191, .6); margin-bottom: 12px; }
.pr:nth-child(2) .pr-ico { background: linear-gradient(135deg, #bfe3ff, #4aa3f0); box-shadow: 0 6px 18px -4px rgba(74, 163, 240, .6); }
.pr:nth-child(3) .pr-ico { background: linear-gradient(135deg, #ffe9b8, #f0b94a); box-shadow: 0 6px 18px -4px rgba(240, 185, 74, .6); }
.pr-en { font-size: .68rem; letter-spacing: .13em; text-transform: uppercase; color: var(--a-ink-3); }
.pr b { display: block; font-family: var(--display); font-weight: 600; font-size: 1.04rem; line-height: 1.45; }
.pr p { font-size: .84rem; color: var(--a-ink-2); margin-top: 4px; line-height: 1.6; }

.flow { list-style: none; margin: 22px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; counter-reset: flow; }
.flow li { position: relative; padding-top: 16px; font-size: .86rem; color: var(--a-ink-2); line-height: 1.5; }
.flow li::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--a-mint), rgba(94, 234, 212, .08)); }
.flow li::after { content: ""; position: absolute; left: 0; top: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--a-mint); box-shadow: 0 0 12px var(--a-mint); }
.flow .n { display: block; font-family: var(--display); font-size: .74rem; letter-spacing: .14em; color: var(--a-mint); }
.flow b { display: block; color: #fff; font-weight: 600; }
.auth-foot { margin-top: 24px; font-size: .78rem; color: var(--a-ink-3); }

.auth-card { position: relative; border-radius: 28px; padding: 1px; background: linear-gradient(145deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .04) 42%, rgba(94, 234, 212, .3)); box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .8), 0 0 80px -30px rgba(45, 212, 191, .45); }
.auth-card::before {
  content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: conic-gradient(from var(--spin), transparent 0 60%, rgba(94, 234, 212, .95) 76%, #fff 83%, rgba(243, 205, 126, .95) 90%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin-border 7s linear infinite;
}
@keyframes spin-border { to { --spin: 360deg; } }
.auth-card-in { position: relative; border-radius: 27px; padding: 30px 30px 28px; max-height: calc(100vh - 116px); max-height: calc(100dvh - 116px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .28) transparent; background: linear-gradient(180deg, rgba(9, 44, 46, .78), rgba(4, 24, 27, .82)); -webkit-backdrop-filter: blur(26px) saturate(150%); backdrop-filter: blur(26px) saturate(150%); }
.card-hello { margin-bottom: 18px; }
.card-hello h2 { font-family: var(--display); font-size: 1.5rem; font-weight: 600; line-height: 1.4; }
.card-hello p { font-size: .9rem; color: var(--a-ink-2); }
.card-secure { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 18px; font-size: .78rem; color: var(--a-ink-3); }

.auth .label { color: var(--a-ink-2); }
.auth .input, .auth .select, .auth .textarea { min-height: 48px; border-radius: 13px; background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .15); color: var(--a-ink); }
.auth .input::placeholder { color: var(--a-ink-3); }
.auth .input:hover, .auth .select:hover { border-color: rgba(255, 255, 255, .3); }
.auth .input:focus, .auth .select:focus, .auth .textarea:focus { border-color: var(--a-mint); background: rgba(255, 255, 255, .09); box-shadow: 0 0 0 4px rgba(94, 234, 212, .17); }
.auth .select option { background: #0b2b2c; color: #fff; }
.auth input:-webkit-autofill, .auth input:-webkit-autofill:focus { -webkit-text-fill-color: #ecfffb; caret-color: #fff; box-shadow: 0 0 0 1000px #0d3537 inset, 0 0 0 4px rgba(94, 234, 212, .12); transition: background-color 99999s; }
.auth .req { color: #fda4af; }
.auth .link-btn { color: var(--a-mint); }
.auth .btn { min-height: 50px; border-radius: 14px; color: #032624; font-weight: 700; background: linear-gradient(135deg, #8ff7e5, #2dd4bf 52%, #14b8a6); box-shadow: 0 14px 34px -10px rgba(45, 212, 191, .7), inset 0 1px 0 rgba(255, 255, 255, .55); }
.auth .btn:hover { background: linear-gradient(135deg, #a5fbeb, #45e0cb 52%, #1cc6b3); transform: translateY(-1px); }
.auth .btn:active { transform: translateY(1px); }
.auth .btn.loading::after { border-color: rgba(3, 38, 36, .25); border-top-color: #032624; }
.auth .btn:focus-visible, .auth .tab:focus-visible, .auth .link-btn:focus-visible, .auth .pw-eye:focus-visible { outline: 3px solid rgba(94, 234, 212, .55); outline-offset: 2px; }
.auth .tabs { background: rgba(255, 255, 255, .06); border: 1px solid var(--a-line); border-radius: 15px; }
.auth .tab { color: var(--a-ink-2); border-radius: 11px; padding: 10px 8px; }
.auth .tab.active { background: rgba(255, 255, 255, .15); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 6px 16px rgba(0, 0, 0, .28); }
.auth .note { background: rgba(94, 234, 212, .08); border-color: rgba(94, 234, 212, .26); color: var(--a-ink); }
.auth .note .ico { color: var(--a-mint); }
.auth .note.bad { background: rgba(244, 63, 94, .13); border-color: rgba(251, 113, 133, .45); }
.auth .note.bad .ico { color: #fda4af; }
.auth .note.ok { background: rgba(52, 211, 153, .13); border-color: rgba(52, 211, 153, .45); }
.auth .note.ok .ico { color: #6ee7b7; }
.auth .invite { border-radius: 16px; border: 1px solid rgba(243, 205, 126, .42); background: linear-gradient(135deg, rgba(243, 205, 126, .17), rgba(243, 205, 126, .04)); padding: 14px 16px; margin-bottom: 18px; }
.auth .invite .eyebrow { color: var(--a-gold); }
.auth .invite h3 { font-size: 1.02rem; margin-top: 2px; }
.pw { position: relative; display: block; }
.pw .input { padding-right: 50px; }
.pw-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border: 0; border-radius: 10px; background: none; color: var(--a-ink-3); cursor: pointer; display: grid; place-items: center; }
.pw-eye:hover { color: var(--a-ink); background: rgba(255, 255, 255, .08); }

.splash { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; }
.splash .emblem { width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 18px; animation: breathe 2.4s ease-in-out infinite; }
.splash .emblem svg { width: 42px; height: 42px; }
.splash h3 { font-family: var(--display); font-size: 1.3rem; font-weight: 600; }
.splash p { color: var(--a-ink-2); margin-top: 4px; font-size: .92rem; }
.splash .bar { width: 180px; height: 3px; border-radius: 3px; margin: 20px auto 0; background: rgba(255, 255, 255, .1); overflow: hidden; }
.splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, transparent, var(--a-mint), transparent); animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
@keyframes breathe { 50% { transform: scale(1.06); box-shadow: 0 0 50px rgba(94, 234, 212, .45), inset 0 1px 0 rgba(255, 255, 255, .25); } }

.auth.intro .rise { animation: rise .9s cubic-bezier(.2, .75, .2, 1) both; animation-delay: calc(var(--i, 0) * 95ms); }
@keyframes rise { from { opacity: 0; transform: translateY(22px); } }

.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--na-soft); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
.tab { border: 0; background: none; padding: 9px 8px; border-radius: 9px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.tab.active { background: var(--surface); color: var(--brand-dark); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }

/* ทุกขนาดจออยู่ในหน้าเดียว: ย่อส่วนประกอบตามความสูงจอ และให้ฟอร์มยาวเลื่อนภายในการ์ด */
@media (min-width: 1081px) and (max-height: 880px) {
  .pr p, .auth-foot { display: none; }
  .pr { padding: 13px 14px 12px; }
  .pr b { font-size: .95rem; }
  .pr-ico { margin-bottom: 8px; }
  .flow { margin-top: 16px; }
}
@media (min-width: 1081px) and (max-height: 720px) {
  .flow, .hero-pill, .card-secure { display: none; }
  .hero-title { margin-top: 0; }
  .auth-card-in { padding: 22px 26px 20px; }
}
@media (min-width: 1081px) and (max-height: 640px) {
  .principles, .card-hello p, .alt-link { display: none; }
  .card-hello { margin-bottom: 12px; }
  .auth .tabs { margin-bottom: 14px; }
}
@media (max-width: 1080px) {
  .auth-body { display: flex; flex-direction: column; align-items: center; row-gap: clamp(12px, 2.6vh, 26px); }
  .hero-head { flex: none; align-self: auto; text-align: center; }
  .hero-lead { margin-left: auto; margin-right: auto; }
  .hero-more { display: none; }
  .auth-panel { flex: 1 1 auto; min-height: 0; width: 100%; max-width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .auth-card { display: flex; flex-direction: column; min-height: 0; }
  .auth-card-in { flex: 1 1 auto; min-height: 0; max-height: none; }
  .hero-title .grad { font-size: clamp(2.6rem, min(9vw, 11vh), 6rem); }
  .hero-title .uni { font-size: clamp(1.3rem, min(4.2vw, 4.8vh), 2.6rem); }
  .orbits { right: 50%; transform: translate(50%, -50%); top: 38%; opacity: .7; }
}
@media (max-width: 1080px) and (max-height: 980px) {
  .hero-lead { display: none; }
}
@media (max-width: 1080px) and (max-height: 820px) {
  .hero-pill, .card-secure, .card-hello p { display: none; }
  .hero-title { margin-top: 0; }
  .card-hello { margin-bottom: 12px; }
}
@media (max-width: 620px) {
  .auth-top { padding-top: 14px; }
  .auth-tag, .hero-lead, .card-secure { display: none; }
  .hero-pill { font-size: .7rem; letter-spacing: .04em; }
  .hero-title .grad { font-size: clamp(2.4rem, min(16vw, 9.4vh), 4.2rem); }
  .hero-title .uni { font-size: clamp(1.15rem, min(6.2vw, 3.7vh), 1.8rem); }
  .auth-card-in { padding: 22px 20px 20px; }
  .auth .tab { white-space: nowrap; font-size: .9rem; padding: 10px 2px; }
}
@media (max-width: 620px) and (max-height: 780px) {
  .hero-pill, .card-hello p { display: none; }
  .hero-title { margin-top: 0; }
  .card-hello { margin-bottom: 12px; }
  .auth .tabs { margin-bottom: 14px; }
}
@media (max-width: 620px) and (max-height: 680px) {
  .alt-link { display: none; }
  .auth .stack > * + * { margin-top: 12px; }
  .auth .input, .auth .select { min-height: 44px; }
  .auth .btn { min-height: 46px; }
  .auth-card-in { padding: 18px 18px 18px; }
  .card-hello h2 { font-size: 1.25rem; }
}
@media (max-width: 620px) and (max-height: 600px) {
  .card-hello { display: none; }
  .emblem { width: 40px; height: 40px; border-radius: 12px; }
  .emblem svg { width: 23px; height: 23px; }
  .auth-top { padding-top: 10px; }
  .auth-body { padding-top: 8px; row-gap: 10px; }
}
/* จอเตี้ยมาก (เช่น มือถือแนวนอน): ยอมให้เลื่อนหน้าได้ เพื่อไม่ให้เนื้อหาถูกตัด */
@media (max-height: 520px) {
  .auth { height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
  .auth-panel { flex: none; }
  .auth-card-in { max-height: none; overflow: visible; }
}
@media (prefers-reduced-motion: reduce) {
  .aurora, .orbits .spin, .auth-card::before, .hero-title .grad, .live, .splash .emblem, .splash .bar::after, .auth.intro .rise { animation: none !important; }
}

/* ---------- Project cards ---------- */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
.pcard { display: flex; flex-direction: column; padding: 18px 20px; gap: 10px; }
.pcard h3 { font-size: 1.04rem; line-height: 1.5; overflow-wrap: anywhere; }
.pcard .code { font-size: .82rem; font-weight: 600; color: var(--brand); letter-spacing: .02em; }
.pcard .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--ink-2); font-size: .87rem; }
.pcard .meta span { display: inline-flex; gap: 5px; align-items: center; }
.pcard .actions { margin-top: auto; padding-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.pcard.highlight { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(194, 145, 58, .18), var(--shadow); }

/* ---------- Meter ---------- */
.meter { display: flex; align-items: center; gap: 10px; }
.meter-track { flex: 1 1 auto; height: 8px; border-radius: 999px; background: #e3e8e6; overflow: hidden; min-width: 70px; }
.meter-fill { height: 100%; border-radius: 999px; background: var(--info); }
.meter.prog .meter-track { background: var(--info-track); }
.meter.done .meter-track { background: var(--good-track); }
.meter.done .meter-fill { background: var(--good); }
.meter-label { font-size: .87rem; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meter-label small { font-weight: 400; color: var(--muted); }

/* ---------- Stepper & review ---------- */
.review-head { padding: 22px 24px; }
.review-head h1 { font-size: 1.3rem; line-height: 1.5; overflow-wrap: anywhere; }
.stepper { display: flex; gap: 0; margin: 18px 0 20px; counter-reset: step; overflow-x: auto; scrollbar-width: none; }
.stepper::-webkit-scrollbar { display: none; }
.step { flex: 1 1 0; min-width: 118px; border: 0; background: none; cursor: pointer; padding: 0 6px; text-align: center; position: relative; color: var(--muted); font-size: .86rem; font-weight: 500; }
.step::before { content: ""; position: absolute; top: 17px; left: -50%; width: 100%; height: 2px; background: var(--line-2); }
.step:first-child::before { display: none; }
.step .dot { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-2); display: grid; place-items: center; margin: 0 auto 6px; font-weight: 600; color: var(--muted); }
.step.done::before, .step.active::before { background: var(--brand); }
.step.done .dot { background: var(--brand); border-color: var(--brand); color: #fff; }
.step.active .dot { border-color: var(--brand); color: var(--brand-dark); box-shadow: 0 0 0 4px rgba(14, 107, 100, .15); }
.step.active { color: var(--brand-dark); font-weight: 600; }
.step.done { color: var(--ink-2); }
.step-caption { display: none; text-align: center; font-weight: 600; color: var(--brand-dark); margin: -8px 0 16px; }
.step-caption small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }

.sec { overflow: hidden; }
.sec-head { padding: 14px 22px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--brand-softer); border-bottom: 1px solid var(--line); }
.sec-head h3 { font-size: 1.04rem; }
.sec-count { font-size: .84rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.q { padding: 18px 22px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; align-items: start; scroll-margin-top: 80px; }
.q:last-child { border-bottom: 0; }
.q.sub { padding-left: 46px; background: linear-gradient(90deg, var(--surface-2), var(--surface) 40%); }
.q.group { display: block; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.q.missing { box-shadow: inset 4px 0 0 var(--bad); background: #fffafa; }
.q-text { display: flex; gap: 10px; min-width: 0; }
.q-no { flex: none; min-width: 30px; height: 26px; padding: 0 6px; border-radius: 7px; background: var(--brand-soft); color: var(--brand-dark); font-weight: 600; font-size: .84rem; display: grid; place-items: center; margin-top: 2px; font-variant-numeric: tabular-nums; }
.q-title { font-weight: 600; overflow-wrap: anywhere; }
.q-desc { color: var(--ink-2); font-size: .92rem; margin-top: 2px; overflow-wrap: anywhere; }
.q-ref { color: var(--muted); font-size: .8rem; font-weight: 400; }
.q-note { color: var(--warn-ink); font-size: .86rem; margin-top: 4px; }
.q-extra { grid-column: 1 / -1; }
.seg { display: inline-grid; grid-template-columns: repeat(3, auto); border: 1px solid var(--line-2); border-radius: 11px; overflow: hidden; background: var(--surface); }
.seg-btn { border: 0; background: none; padding: 8px 13px; min-height: 42px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; font-weight: 500; font-size: .9rem; color: var(--ink-2); border-left: 1px solid var(--line-2); white-space: nowrap; }
.seg-btn:first-child { border-left: 0; }
.seg-btn:hover { background: var(--surface-2); }
.seg-btn .ico { stroke-width: 2.6; }
.seg-btn[aria-checked="true"][data-rate="ok"] { background: var(--good-soft); color: var(--good-ink); font-weight: 600; }
.seg-btn[aria-checked="true"][data-rate="no"] { background: var(--bad-soft); color: var(--bad-ink); font-weight: 600; }
.seg-btn[aria-checked="true"][data-rate="na"] { background: #e3e7e6; color: var(--ink); font-weight: 600; }

.choices { display: grid; gap: 10px; }
.choices.cols { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.choice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 11px; cursor: pointer; background: var(--surface); transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--brand); }
.choice input { width: 18px; height: 18px; margin: 4px 0 0; accent-color: var(--brand); flex: none; }
.choice.on { border-color: var(--brand); background: var(--brand-softer); box-shadow: inset 0 0 0 1px var(--brand); }
.choice b { font-weight: 600; }
.choice .c-sub { display: block; color: var(--ink-2); font-size: .88rem; }
.choice.nested { margin-left: 30px; padding: 9px 12px; }
.crit-note { margin: 2px 0 4px 30px; font-size: .86rem; color: var(--ink-2); padding: 8px 12px; border-left: 3px solid var(--line-2); background: var(--surface-2); border-radius: 0 8px 8px 0; }

.actionbar { position: sticky; bottom: 0; z-index: 15; background: rgba(255, 255, 255, .94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); margin-top: 24px; }
.actionbar-in { display: flex; gap: 10px; align-items: center; padding: 12px 0; flex-wrap: wrap; }
.actionbar .progress-txt { font-size: .86rem; color: var(--ink-2); margin-right: auto; }

.sumlist { list-style: none; margin: 0; padding: 0; counter-reset: pt; }
.sumlist li { counter-increment: pt; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.sumlist li:last-child { border-bottom: 0; }
.sumlist li::before { content: counter(pt); width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-dark); display: grid; place-items: center; font-weight: 600; font-size: .86rem; }
.sumlist .src { font-size: .84rem; color: var(--ink-2); }

/* ---------- Overview ---------- */
.rv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.rv { padding: 18px 20px; }
.rv-top { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-dark); display: grid; place-items: center; font-weight: 600; flex: none; }
.kv { display: grid; grid-template-columns: 142px minmax(0, 1fr); gap: 6px 12px; font-size: .92rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.cgroup { padding: 16px 22px; border-bottom: 1px solid var(--line); }
.cgroup:last-child { border-bottom: 0; }
.cgroup h4 { font-size: .98rem; }
.cgroup .c-sec { font-size: .8rem; color: var(--muted); }
.citem { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.citem .who { font-size: .84rem; font-weight: 600; color: var(--ink-2); grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.citem .txt { grid-column: 1 / -1; }
.point { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.point:last-child { border-bottom: 0; }
.point-no { width: 30px; height: 30px; margin-top: 7px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: .88rem; }
.point-tools { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 124px; }
.point-kind { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 2px 12px; font-size: .82rem; cursor: pointer; color: var(--ink-2); }
.pill.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.pill.on.alt { background: var(--gold); border-color: var(--gold); }
details.fold > summary { cursor: pointer; padding: 14px 22px; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: center; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .chev { transition: transform .2s; margin-left: auto; color: var(--muted); }
details.fold[open] > summary .chev { transform: rotate(180deg); }
details.fold[open] > summary { border-bottom: 1px solid var(--line); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .93rem; }
.tbl th { text-align: left; font-weight: 600; font-size: .82rem; color: var(--ink-2); padding: 11px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 13px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover { background: var(--brand-softer); }
.tbl .t-title { font-weight: 600; overflow-wrap: anywhere; min-width: 220px; }
.tbl .t-code { font-size: .8rem; color: var(--brand); font-weight: 600; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.center, .tbl th.center { text-align: center; }
.mx { font-size: .86rem; }
.mx td, .mx th { padding: 8px 10px; }
.mx .mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; }
.mx .mark.ok { background: var(--good-soft); color: var(--good-ink); }
.mx .mark.no { background: var(--bad-soft); color: var(--bad-ink); }
.mx .mark.na { background: var(--na-soft); color: var(--ink-2); }
.mx tr.sechead td { background: var(--brand-softer); font-weight: 600; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { padding: 18px 20px; }
.kpi-label { font-size: .87rem; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.kpi-label .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--line-2); flex: none; }
.kpi-value { font-size: 2.1rem; font-weight: 600; line-height: 1.25; margin-top: 4px; }
.kpi-value small { font-size: .9rem; font-weight: 400; color: var(--muted); margin-left: 4px; }
.kpi-sub { font-size: .82rem; color: var(--muted); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: flex-end; flex: 1 1 320px; }
.filters .input { flex: 1 1 200px; width: auto; max-width: 320px; min-width: 0; }
.filters .select { flex: 0 1 auto; width: auto; min-width: 150px; }
.names { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Modal / toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(9, 28, 26, .55); z-index: 100; display: grid; place-items: center; padding: 20px; overflow-y: auto; animation: fade .15s; }
.modal { width: 100%; max-width: 600px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg); max-height: calc(100vh - 40px); display: flex; flex-direction: column; animation: pop .18s; }
.modal.wide { max-width: 860px; }
.modal.narrow { max-width: 440px; }
.modal-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
.modal-head h3 { font-size: 1.12rem; flex: 1; }
.modal-body { padding: 20px 22px; overflow-y: auto; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
#toast-root { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; width: min(92vw, 460px); pointer-events: none; }
.toast { background: #12302d; color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow-lg); display: flex; gap: 10px; align-items: flex-start; font-size: .93rem; animation: pop .2s; }
.toast.bad { background: #7d1f1f; }
.toast.good .ico { color: #7be07b; }
.qr-box { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; align-items: start; }
.qr-frame { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #fff; }
.qr-frame svg, .qr-frame img { display: block; width: 100%; height: auto; }
.copyrow { display: flex; gap: 8px; }
.copyrow .input { font-size: .88rem; min-width: 0; }
.copyrow .btn { flex: none; }
.skeleton { border-radius: var(--radius); background: linear-gradient(90deg, #e8edeb 25%, #f3f6f5 50%, #e8edeb 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; height: 120px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- SOP guide ---------- */
.guide-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; }
.guide-nav { position: sticky; top: 64px; padding: 10px; display: grid; gap: 2px; }
.guide-nav button { text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 9px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.guide-nav button:hover { background: var(--surface-2); }
.guide-nav button.active { background: var(--brand-soft); color: var(--brand-dark); font-weight: 600; }
.g-block { margin-top: 8px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 8px; }
.g-block .g-mark { color: var(--brand-dark); font-weight: 600; font-variant-numeric: tabular-nums; }
.g-l2 { margin-left: 26px; }
.g-l3 { margin-left: 52px; }
.g-note { grid-template-columns: minmax(0, 1fr); background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; font-size: .92rem; }
.g-sec + .g-sec { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
.g-sec h4 { font-size: 1.02rem; }
.g-sec h4 .g-no { color: var(--brand); font-weight: 600; margin-right: 8px; font-size: .9rem; }
.g-list { margin: 8px 0 0; padding-left: 22px; }
.g-list li { margin-top: 4px; }
.type-badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }

#print-root { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .guide-layout { grid-template-columns: 1fr; }
  .guide-nav { position: static; display: flex; overflow-x: auto; white-space: nowrap; }
}
@media (max-width: 720px) {
  body { font-size: 15.5px; }
  .wrap { padding: 0 14px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .user-meta { display: none; }
  .brand-sub { display: none; }
  .brand-name { font-size: .93rem; }
  .page-head { padding: 20px 0 14px; }
  .page-head h1 { font-size: 1.3rem; }
  .card-pad, .card-body { padding: 16px; }
  .card-head, .sec-head, .cgroup, details.fold > summary { padding-left: 16px; padding-right: 16px; }
  .review-head { padding: 16px; }
  .q { grid-template-columns: 1fr; padding: 16px; }
  .q.sub { padding-left: 24px; }
  .stepper { margin: 16px 0; overflow: visible; }
  .step { min-width: 0; padding: 0; }
  .step .lbl { display: none; }
  .step .dot { margin-bottom: 0; }
  .step-caption { display: block; }
  .sec-head .grow { flex-basis: 100%; }
  .sec-head .btn { margin-left: auto; }
  .filters { justify-content: stretch; }
  .filters .input { max-width: none; flex-basis: 100%; }
  .filters .select { flex: 1 1 0; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; }
  .seg-btn { padding: 8px 4px; font-size: .86rem; }
  .pgrid { grid-template-columns: 1fr; }
  .qr-box { grid-template-columns: 1fr; }
  .qr-frame { max-width: 240px; margin: 0 auto; }
  .point { grid-template-columns: 30px minmax(0, 1fr); }
  .point-tools { grid-column: 2; max-width: none; justify-content: flex-start; }
  .choice.nested, .crit-note { margin-left: 14px; }
  .actionbar .progress-txt { flex-basis: 100%; margin: 0; }
  .actionbar .btn { flex: 1 1 auto; padding: 8px 12px; }
  .kv { grid-template-columns: 112px minmax(0, 1fr); }
  .kpi-value { font-size: 1.8rem; }
  .tbl.cards thead { display: none; }
  .tbl.cards, .tbl.cards tbody, .tbl.cards tr, .tbl.cards td { display: block; width: 100%; }
  .tbl.cards tr { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .tbl.cards tr:last-child { border-bottom: 0; }
  .tbl.cards td { border: 0; padding: 3px 0; text-align: left !important; }
  .tbl.cards td[data-th]::before { content: attr(data-th); display: block; font-size: .76rem; color: var(--muted); font-weight: 500; }
  .tbl.cards td.t-main::before { display: none; }
}

/* ---------- Print ---------- */
@media print {
  @page { size: A4; margin: 18mm 16mm; }
  body { background: #fff; font-size: 12.5pt; line-height: 1.5; }
  #app, #modal-root, #toast-root { display: none !important; }
  #print-root { display: block; font-family: "Sarabun", "TH SarabunPSK", "IBM Plex Sans Thai", "Leelawadee UI", sans-serif; color: #000; }
  .p-form { text-align: right; font-size: 10.5pt; color: #333; }
  .p-title { text-align: center; font-size: 14.5pt; font-weight: 700; margin: 6pt 0 10pt; }
  .p-meta { margin-bottom: 8pt; }
  .p-meta div { margin-top: 2pt; }
  .p-h { font-weight: 700; margin: 12pt 0 4pt; font-size: 12.5pt; break-after: avoid; break-inside: avoid; }
  .p-list li, .p-meta div { break-inside: avoid; }
  table.p-tbl { width: 100%; border-collapse: collapse; font-size: 11.5pt; }
  .p-tbl th, .p-tbl td { border: 1px solid #000; padding: 4pt 6pt; vertical-align: top; }
  .p-tbl th { background: #eee; text-align: center; font-weight: 700; }
  .p-tbl td.c { text-align: center; width: 13mm; }
  .p-tbl tr { break-inside: avoid; }
  .p-tbl tr.s td { background: #f3f3f3; font-weight: 700; }
  .p-box { border: 1px solid #000; padding: 6pt 9pt; margin-top: 6pt; break-inside: avoid; }
  .p-sign { margin-top: 26pt; margin-left: 50%; text-align: center; break-inside: avoid; }
  .p-list { margin: 2pt 0 0; padding-left: 18pt; }
  .p-list li { margin-top: 2pt; }
  .p-pre { white-space: pre-wrap; }
  .p-qr { width: 70mm; margin: 10pt auto; }
  .p-qr svg { width: 100%; height: auto; display: block; }
  .p-center { text-align: center; }
  .p-cb { font-family: "Segoe UI Symbol", "Arial Unicode MS", sans-serif; }
}

</style>

var SOP = {"criteria": {"exempt": [{"id": "X1", "no": "1", "text": "โครงการวิจัยทางการศึกษาที่ดำเนินการในสถาบันทางการศึกษา ที่ต้อง", "subs": [{"id": "X1.1", "no": "1.1", "text": "เป็นการวิจัยที่เกี่ยวข้องกับการเรียนการสอนที่มีการจัดการเรียนรู้ตามแนวปฏิบัติปกติที่เป็นที่ยอมรับในวงกว้าง หรือ"}, {"id": "X1.2", "no": "1.2", "text": "การประเมินวิเคราะห์หลักสูตร หรือ"}, {"id": "X1.3", "no": "1.3", "text": "วิธีการบริหารจัดการชั้นเรียน หรือ"}, {"id": "X1.4", "no": "1.4", "text": "การประกันคุณภาพการศึกษา"}], "note": "ทั้งนี้ งานวิจัยนั้นต้องไม่ทำให้อาสาสมัครเสียโอกาสในการเรียนตามเนื้อหาและเวลาเรียนตามที่หลักสูตรกำหนดไว้"}, {"id": "X2", "no": "2", "text": "โครงการวิจัยที่มีลักษณะ ดังนี้", "subs": [{"id": "X2.1", "no": "2.1", "text": "โครงการวิจัยที่ใช้ผลทดสอบทางการศึกษา (การประเมินความรู้ การวิเคราะห์ปัญหา เจตคติ ผลสัมฤทธิ์ทางการศึกษา) หรือ"}, {"id": "X2.2", "no": "2.2", "text": "โครงการวิจัยที่ใช้ระเบียบวิธีวิจัยเชิงปริมาณ หรือใช้วิธีการสำรวจ หรือการสัมภาษณ์โดยใช้แบบสอบถาม หรือ"}, {"id": "X2.3", "no": "2.3", "text": "โครงการวิจัยที่มีการเฝ้าสังเกตพฤติกรรมสาธารณะ"}], "note": "ทั้งนี้หากใช้ผลทดสอบทางการศึกษาหรือแบบบันทึกข้อมูลของหน่วยงาน ต้องได้รับความยินยอมเป็นลายลักษณ์อักษรจากผู้รับผิดชอบข้อมูลก่อน รวมถึงการบันทึกข้อมูลนั้นจะต้องไม่สามารถสืบเสาะถึงตัวบุคคลผู้เป็นเจ้าของข้อมูลหรือเป็นการเปิดเผยตัวตนของเจ้าของข้อมูล และเป็นข้อมูลวิจัยที่ไม่เกี่ยวข้องกับประเด็นอ่อนไหว เช่น พฤติกรรมหรือทัศนคติทางเพศ การติดสุราหรือสารเสพติด การกระทำผิดศีลธรรมหรือกฎหมายในลักษณะอื่น ๆ ความเจ็บป่วยทางจิตหรือโรคติดต่อ เช่น HIV/AIDs, โรควัณโรค ฯลฯ และการเปิดเผยผลการตอบของบุคคล ต้องไม่ทำให้เกิดความเสี่ยงของบุคคลในการรับโทษ หรือเกิดความเสียหายต่อร่างกาย จิตใจ ชื่อเสียง อาชีพการงาน สถานภาพทางการเงิน สิทธิประโยชน์และผลตอบแทนใด ๆ ที่พึงได้ต่อบุคคลผู้เป็นเจ้าของข้อมูล หรือสถาบัน"}, {"id": "X3", "no": "3", "text": "โครงการวิจัยทางด้านบริการสาธารณะ เช่น โครงการวิจัยประเมินระบบงาน โครงการวิจัยบริหารจัดการ โครงการวิจัยสถาบัน โครงการสาธิต หรือโครงการสำรวจ หรือโครงการประเมินระบบงานที่ได้รับอนุญาตจากหัวหน้าหน่วยงานหรือผู้รับผิดชอบองค์กร และมีวัตถุประสงค์เพื่อประเมินประสิทธิภาพ หรือศึกษาทางเลือก หรือพัฒนาระบบงานหรือนโยบาย และไม่มีการเปิดเผยชื่อบุคคลหรือข้อมูลส่วนบุคคลของอาสาสมัครในโครงการ"}, {"id": "X4", "no": "4", "text": "โครงการวิจัยที่ใช้ข้อมูลทุติยภูมิ หรือภาพถ่าย หรือคลิปวิดีโอที่เผยแพร่ทั่วไปในสาธารณะ ซึ่งทุกคนสามารถเข้าถึงได้อย่างอิสระ แต่หากใช้ข้อมูลทุติยภูมิที่ไม่ได้เผยแพร่ทั่วไปในสาธารณะ ซึ่งเป็นข้อมูลที่บุคคล หน่วยงาน หรือองค์กรเจ้าของข้อมูลรวบรวมไว้เพื่อวัตถุประสงค์อื่นใด จำเป็นต้องได้รับอนุญาตจากเจ้าของข้อมูลทุติยภูมินั้นก่อน ทั้งนี้ข้อมูลนั้นต้องไม่สามารถเชื่อมโยงผู้เป็นเจ้าของข้อมูล และไม่ก่อให้เกิดความเสียหายต่อชื่อเสียง ทรัพย์สิน และความภาคภูมิใจ"}, {"id": "X5", "no": "5", "text": "โครงการสำรวจความพึงพอใจในรสชาติของอาหารหรือผลิตภัณฑ์ที่ใช้บริโภคเพื่อประเมินคุณภาพโดยใช้ประสาทสัมผัส เช่น การดมกลิ่น การสัมผัส หรือการชิมรสชาติของอาหาร ที่ไม่มีส่วนประกอบของสารเสพติด หรือสารก่อโทษต่อมนุษย์ และไม่ก่อให้เกิดโทษต่อสุขภาพของผู้บริโภค ทั้งนี้ ต้องเป็นอาหารที่ปลอดภัย มีสารอาหารอยู่ในปริมาณที่กำหนดว่าปลอดภัยไม่ก่อให้เกิดหรือกระตุ้นให้เกิดการแพ้ต่อผู้บริโภค และผ่านการรับรองความปลอดภัยจากสำนักงานคณะกรรมการอาหารและยา หรือหน่วยงานที่เกี่ยวข้อง"}, {"id": "X6", "no": "6", "text": "โครงการวิจัยอื่น ๆ ตามที่คณะกรรมการจริยธรรมเห็นชอบ"}], "expedited": [{"id": "E1", "no": "1", "text": "โครงการวิจัย Clinical Intervention ที่ไม่รุกล้ำร่างกายหรือไม่มีการกระทำกับร่างกายของอาสาสมัคร เช่น การตรวจน้ำลายหากให้อาสาสมัครบ้วนน้ำลายถือว่าไม่มีการรุกล้ำร่างกาย แต่หากมีการสอดท่อหรือสายเพื่อเก็บน้ำลายถือว่าเป็นการรุกล้ำร่างกาย"}, {"id": "E2", "no": "2", "text": "โครงการวิจัยที่ต้องเก็บเลือดจากอาสาสมัคร ทั้งนี้อาสาสมัครต้องเป็นบุคคลที่มีสุขภาพปกติ จะทำได้โดยการเจาะปลายนิ้ว หรือเจาะจากหลอดเลือดดำ ปริมาณเลือดและจำนวนครั้งที่เจาะควรเป็นดังนี้", "subs": [{"id": "E2.1", "no": "2.1", "text": "ในกรณีเจาะเลือดจากอาสาสมัครที่เป็นผู้ใหญ่ มีสุขภาพแข็งแรงและมิใช่สตรีมีครรภ์ มีน้ำหนักตัวไม่ต่ำกว่า 50 กิโลกรัม ปริมาณเลือดทั้งหมดที่เจาะจะต้องไม่เกิน 450 มิลลิลิตร ภายในระยะเวลา 8 สัปดาห์ และการเจาะเลือดจะต้องไม่เกินสัปดาห์ละ 2 ครั้งทั้งนี้ต้องไม่เกิน 100 มิลลิลิตร ต่อการเจาะเลือด 1 ครั้ง ในกรณีที่อาสาสมัครเป็นผู้ใหญ่ที่มีน้ำหนักตัวน้อยกว่า 50 กิโลกรัม ปริมาณเลือดที่เจาะจะต้องไม่เกิน 50 มิลลิลิตร ภายในระยะเวลา 8 สัปดาห์ และการเจาะเลือดจะต้องไม่เกินสัปดาห์ละ 2 ครั้ง ทั้งนี้ต้องไม่เกิน 25 มิลลิลิตร ต่อการเจาะเลือด 1 ครั้ง"}, {"id": "E2.2", "no": "2.2", "text": "ในกรณีที่อาสาสมัครเป็นเด็กอายุ ไม่เกิน 15 ปี ปริมาณเลือดที่เจาะต้องไม่เกิน 3 มิลลิลิตรต่อน้ำหนักตัว 1 กิโลกรัม ภายในระยะเวลา 8 สัปดาห์ และการเจาะเลือดจะต้องไม่เกินสัปดาห์ละ 2 ครั้ง การเจาะเลือดนั้นต้องกระทำโดยผู้ที่มีความเชี่ยวชาญ และตามบทบาทวิชาชีพที่กำหนด"}]}, {"id": "E3", "no": "3", "text": "โครงการวิจัยที่เก็บตัวอย่างสิ่งส่งตรวจด้วยวิธีที่ไม่ทำให้เกิดการบาดเจ็บต่ออาสาสมัคร ได้แก่", "subs": [{"id": "E3.1", "no": "3.1", "text": "การเก็บตัวอย่างผม และเล็บ โดยการตัดที่มิได้ทำให้เกิดการผิดรูป"}, {"id": "E3.2", "no": "3.2", "text": "การเก็บฟันน้ำนมที่หลุดเองตามธรรมชาติหรือจำเป็นต้องถอนออกเพื่อการรักษาตามมาตรฐานทางทันตกรรม"}, {"id": "E3.3", "no": "3.3", "text": "การเก็บฟันแท้ที่จำเป็นต้องถอนออกเพื่อการรักษา ตามมาตรฐานทางทันตกรรม"}, {"id": "E3.4", "no": "3.4", "text": "การเก็บสิ่งคัดหลั่งโดยธรรมชาติ เช่น เหงื่อ น้ำลาย และเซลล์สืบพันธุ์"}, {"id": "E3.5", "no": "3.5", "text": "การเก็บรกหลังคลอดตามปกติ"}, {"id": "E3.6", "no": "3.6", "text": "การเก็บน้ำคร่ำในระหว่างการคลอดปกติ"}, {"id": "E3.7", "no": "3.7", "text": "การเก็บหินปูนที่คอฟันหรือแผ่นคราบฟัน (Supra and Sub Gingival Dental Plaque) จากการรักษาขูดหินปูนตามปกติ"}, {"id": "E3.8", "no": "3.8", "text": "การเก็บเยื่อเมือกโดยการขูดเบา ๆ ที่กระพุ้งแก้ม หรือบ้วนปาก"}, {"id": "E3.9", "no": "3.9", "text": "การเก็บเสมหะ ปัสสาวะ อุจจาระ"}, {"id": "E3.10", "no": "3.10", "text": "ชิ้นเนื้อทางพยาธิวิทยา"}]}, {"id": "E4", "no": "4", "text": "โครงการวิจัยที่เก็บข้อมูลโดยใช้เครื่องมือที่ไม่ทำให้เกิดการบาดเจ็บต่ออาสาสมัคร ไม่ต้องใช้ยาชาหรือยาสลบเข้าร่วมในการตรวจนั้น และเป็นวิธีการที่ใช้ในการตรวจเพื่อการรักษาตามมาตรฐาน (ยกเว้นเครื่องมือที่เกี่ยวข้องกับรังสีและคลื่นแม่เหล็กไฟฟ้า รวมถึงการใช้สารกัมมันตภาพรังสี) เครื่องมือนั้นต้องเป็นเครื่องมือที่ได้รับการรับรองมาตรฐานว่าเป็นเครื่องมือทางการแพทย์และมีจำหน่ายตามท้องตลาด (Approved for Marketing) ที่มีคุณลักษณะดังต่อไปนี้", "subs": [{"id": "E4.1", "no": "4.1", "text": "เป็นเครื่องมือที่ใช้ตรวจวัดที่ผิวหนัง หรืออยู่ห่างจากร่างกายของอาสาสมัคร"}, {"id": "E4.2", "no": "4.2", "text": "เป็นการตรวจวัดความไวในการสัมผัส (Sensory Acuity)"}, {"id": "E4.3", "no": "4.3", "text": "การตรวจด้วยวิธี Magnetic Resonance Imaging โดยไม่ใช้สารจำพวก Gadolinium"}, {"id": "E4.4", "no": "4.4", "text": "การตรวจโดยวิธีการต่อไปนี้ คือ Electrocardiography, Echocardiography, Doppler Blood Flow, Ultrasonography, Diagnostic Infrared Imaging, Detection of Naturally Occurring Radioactivity, Electroencephalography, Electroretinography"}, {"id": "E4.5", "no": "4.5", "text": "การตรวจสมรรถภาพร่างกายโดยทั่วไป เช่น Muscular Strength Testing, Body Composition Assessment, Flexibility Testing ที่เหมาะสมกับอายุ น้ำหนัก และสุขภาพทั่วไป ของอาสาสมัคร"}]}, {"id": "E5", "no": "5", "text": "โครงการวิจัยที่เกี่ยวข้องกับการเก็บข้อมูลเอกสาร บันทึก หรือสิ่งส่งตรวจที่ถูกเก็บไว้แล้ว หรือจะถูกเก็บเพื่อวัตถุประสงค์อื่นที่ไม่ใช่งานวิจัย ทั้งนี้ต้องได้รับอนุญาตจากหัวหน้าหรือผู้รับผิดชอบหรือผู้เป็นเจ้าของข้อมูลดังกล่าว เช่น ผู้อำนวยการโรงพยาบาล เป็นต้น"}, {"id": "E6", "no": "6", "text": "โครงการวิจัยที่ใช้ข้อมูลในรูปแบบของเสียง ภาพถ่าย ภาพเคลื่อนไหว ภาพลายพิมพ์ ที่ไม่มีการเผยแพร่ในพื้นที่สาธารณะ โดยข้อมูลนั้นไม่สามารถเชื่อมโยงผู้เป็นเจ้าของข้อมูล โดยได้รับอนุญาตจากหัวหน้างานหรือผู้รับผิดชอบหรือผู้เป็นเจ้าของข้อมูลดังกล่าว เช่น ผู้อำนวยการโรงพยาบาล เป็นต้น"}, {"id": "E7", "no": "7", "text": "การศึกษาจากสิ่งส่งตรวจที่เหลือจากการตรวจวินิจฉัยตามปกติ (Leftover Specimen/Surplus Blood) หรือการวิจัยในห้องปฏิบัติการที่ใช้สิ่งส่งตรวจเดียวกันกับของโครงการที่เคยผ่านการรับรองด้านจริยธรรมการวิจัยแล้ว"}, {"id": "E8", "no": "8", "text": "การตรวจตัวอย่างสิ่งส่งตรวจใด ๆ ซึ่งไม่ใช่การตรวจทางพันธุศาสตร์ที่จะสามารถเชื่อมโยงถึงผู้ที่เป็นเจ้าของข้อมูลหรือสิ่งส่งตรวจได้"}, {"id": "E9", "no": "9", "text": "โครงการวิจัยที่ใช้วิธีการวิจัยเชิงคุณภาพ เช่น การสัมภาษณ์บุคคลหรือกลุ่มบุคคล หรือการทำสนทนากลุ่มที่ประเด็นวิจัยไม่อ่อนไหวและไม่มีการนำบุคคลเปราะบางเข้าร่วมโครงการวิจัย โดยประเด็นอ่อนไหว เช่น พฤติกรรมหรือทัศนคติทางเพศ การติดสุราหรือสารเสพติด การกระทำผิดศีลธรรมหรือกฎหมายในลักษณะอื่น ๆ ความเจ็บป่วยทางจิตหรือโรคติดต่อ เช่น HIV/AIDs โรควัณโรค ฯลฯ และการเปิดเผยผลการตอบของบุคคล ต้องไม่ทำให้เกิดความเสี่ยงของบุคคลในการรับโทษหรือเกิดความเสียหายต่อร่างกาย จิตใจ ชื่อเสียง อาชีพการงาน สถานภาพทางการเงิน สิทธิประโยชน์และผลตอบแทนใด ๆ ที่พึงได้ต่อบุคคลผู้เป็นเจ้าของข้อมูล หรือสถาบัน"}, {"id": "E10", "no": "10", "text": "โครงการวิจัยทางการศึกษาที่ดำเนินการในสถาบันทางการศึกษาเป็นการวิจัยที่เกี่ยวข้องกับการเรียนการสอน การจัดการเรียนรู้ตามแนวปฏิบัติที่เป็นมาตรฐานทางการศึกษา ที่มีลักษณะดังนี้ หลักสูตรหรือวิธีการเรียนการสอนที่พัฒนาขึ้นใหม่ หรือเกี่ยวข้องกับการประเมินประสิทธิภาพของเทคนิคการสอน หรือการประเมินหลักสูตร หรือวิธีการบริหารจัดการชั้นเรียน หรือการประกันคุณภาพการศึกษา ทั้งนี้ งานวิจัยนั้นอาจทำให้อาสาสมัครเสียโอกาสในการเรียนตามเนื้อหาและเวลาเรียนตามที่หลักสูตรกำหนดไว้"}, {"id": "E11", "no": "11", "text": "โครงการวิจัยการพัฒนาแอปพลิเคชัน เช่น โปรแกรม เกม ที่มีการประเมินประสิทธิภาพหรือความพึงพอใจโดยมนุษย์"}, {"id": "E12", "no": "12", "text": "โครงการวิจัยอื่น ๆ ตามที่คณะกรรมการจริยธรรมเห็นชอบ"}], "full": [{"id": "F1", "no": "1", "text": "โครงการวิจัยที่ไม่เข้าข่ายการพิจารณาแบบยกเว้นและไม่เข้าข่ายการพิจารณาแบบเร็ว"}, {"id": "F2", "no": "2", "text": "โครงการวิจัยที่มีประเด็นวิจัยอ่อนไหว เช่น พฤติกรรมหรือทัศนคติทางเพศการติดสุราหรือสารเสพติด การกระทำผิดศีลธรรมหรือกฎหมายในลักษณะอื่น ๆ ความเจ็บป่วยทางจิตหรือโรคติดต่อ เช่น HIV/AIDs โรควัณโรค ฯลฯ และการเปิดเผยผลการตอบของบุคคลต้องไม่ทำให้เกิดความเสี่ยงของบุคคลในการรับโทษ หรือเกิดความเสียหายต่อร่างกาย จิตใจ ชื่อเสียง อาชีพการงาน สถานภาพทางการเงิน สิทธิประโยชน์และผลตอบแทนใด ๆ ที่พึงได้ต่อบุคคลผู้เป็นเจ้าของข้อมูล หรือสถาบัน"}, {"id": "F3", "no": "3", "text": "โครงการวิจัยที่เกี่ยวข้องกับอาสาสมัครซึ่งเป็นกลุ่มเปราะบาง (Vulnerable People) ดังต่อไปนี้", "subs": [{"id": "F3.1", "no": "3.1", "text": "ทารก เด็กอายุต่ำกว่า 18 ปี"}, {"id": "F3.2", "no": "3.2", "text": "สตรีมีครรภ์"}, {"id": "F3.3", "no": "3.3", "text": "เด็กหรือผู้สูงอายุที่อยู่ในสถานสงเคราะห์"}, {"id": "F3.4", "no": "3.4", "text": "ผู้สูงอายุตั้งแต่ 60 ปีขึ้นไป"}, {"id": "F3.5", "no": "3.5", "text": "ผู้ที่อ่านเขียนไม่ได้"}, {"id": "F3.6", "no": "3.6", "text": "ผู้ที่มีความบกพร่องในการตัดสินใจหรือความทรงจำ"}, {"id": "F3.7", "no": "3.7", "text": "ผู้เสพหรือผู้ขายยาเสพติด"}, {"id": "F3.8", "no": "3.8", "text": "ผู้ป่วยโรคติดต่อ เช่น HIV/AIDS โรควัณโรค ฯลฯ"}, {"id": "F3.9", "no": "3.9", "text": "ผู้พิการหรือผู้ที่ไม่สามารถให้ความยินยอมได้ด้วยตนเอง"}, {"id": "F3.10", "no": "3.10", "text": "ผู้ต้องขัง แรงงานต่างด้าว ในบางกรณีอาจรวมทั้งผู้ด้อยโอกาสหรือบุคคลอื่นใดที่ไม่มีอิสระในการตัดสินใจได้อย่างเต็มที่ เป็นต้น"}, {"id": "F3.11", "no": "3.11", "text": "กลุ่มชาติพันธุ์ ที่ไม่สามารถตัดสินใจได้อย่างอิสระ และ/หรืออาจถูกชักจูงให้เข้าร่วมโครงการวิจัยโดยง่าย เนื่องจากมีข้อจำกัดด้านต่างๆ เช่น การศึกษา สถานภาพทางสังคม และเศรษฐสถานะ เป็นต้น"}, {"id": "F3.12", "no": "3.12", "text": "กลุ่มคนชายขอบ"}, {"id": "F3.13", "no": "3.13", "text": "กลุ่มผู้ลี้ภัย"}, {"id": "F3.14", "no": "3.14", "text": "กลุ่มคนไร้ที่อยู่"}, {"id": "F3.15", "no": "3.15", "text": "กลุ่มบุคคลสาธารณะ หรือกลุ่มบุคคลที่กำลังจะได้รับการคัดเลือกเข้าสู่ตำแหน่งที่เกี่ยวข้องกับสาธารณะ เช่น ผู้ที่อยู่ในระหว่างการเสนอชื่อให้เป็นผู้บริหารขององค์กร หรือผู้ที่อยู่ในระหว่างการเสนอชื่อเป็นนักการเมืองท้องถิ่นหรือการเมืองระดับชาติ เป็นต้น"}, {"id": "F3.16", "no": "3.16", "text": "กลุ่มบุคคลที่อาศัยอยู่ในพื้นที่ที่มีข้อพิพาททางสังคม หรือมีข้อพิพาททางกฎหมาย หรือมีการแบ่งฝักฝ่าย หรือเป็นประเด็นที่เสี่ยงต่อการกระตุ้นให้เกิดความขัดแย้งในพื้นที่"}]}, {"id": "F4", "no": "4", "text": "โครงการวิจัยด้านนวัตกรรมทางการศึกษาที่ดำเนินการในสถาบันทางการศึกษา และเป็นการจัดการเรียนรู้โดยใช้หลักสูตรหรือวิธีการเรียนการสอน หรือเกี่ยวข้องกับการประเมินประสิทธิภาพของเทคนิคการสอน หรือการประเมินหลักสูตร หรือวิธีการบริหารจัดการชั้นเรียนที่พัฒนาขึ้นใหม่"}, {"id": "F5", "no": "5", "text": "โครงการวิจัยที่เกี่ยวข้องกับการประดิษฐ์หรือพัฒนาเครื่องมือทางการเกษตร หรือนวัตกรรมทางเทคโนโลยีอุตสาหกรรม ที่มนุษย์ได้สัมผัสโดยตรง ที่มีการทดสอบประสิทธิภาพโดยมนุษย์ เช่น ทดสอบความสั่นสะเทือนของรถไถนา ทดสอบแรงในการหมุนของเครื่องมือทางการเกษตร เครื่องมือทางอุตสาหกรรม เป็นต้น หรือนวัตกรรมทางเทคโนโลยีคอมพิวเตอร์ ที่ต้องมีการสวมใส่อุปกรณ์ในมนุษย์เพื่อทำการทดสอบประสิทธิภาพและใช้งาน"}, {"id": "F6", "no": "6", "text": "โครงการวิจัยที่เกี่ยวข้องกับสิ่งประดิษฐ์ อุปกรณ์หรือนวัตกรรม หรือต้นแบบนวัตกรรม ทางด้านการแพทย์ วิทยาศาสตร์การแพทย์และเทคโนโลยีสุขภาพที่นำมาใช้กับร่างกายมนุษย์ เช่น อุปกรณ์ในการฝึกยืน หุ่นยนต์วัดไข้ สายรัดยึดโยง เป็นต้น"}, {"id": "F7", "no": "7", "text": "โครงการวิจัยที่เกี่ยวข้องกับนวัตกรรมผลิตภัณฑ์ (Product Innovation) ที่พัฒนาใหม่ หรือการปรับปรุงผลิตภัณฑ์เดิมที่มีอยู่ให้มีคุณภาพและประสิทธิภาพดียิ่งขึ้น เช่น ชุดทดสอบ ชุดเครื่องมือ ผลิตภัณฑ์รักษาโรค ป้องกันโรค และคุ้มครองผู้บริโภค เป็นต้น"}, {"id": "F8", "no": "8", "text": "โครงการสำรวจความพึงพอใจในรสชาติของอาหารหรือผลิตภัณฑ์ที่ใช้บริโภคเพื่อประเมินคุณภาพโดยใช้ประสาทสัมผัส เช่น การดมกลิ่น การสัมผัส หรือการชิมรสชาติของอาหาร ที่ไม่มีการรับรองความปลอดภัยจากสำนักงานคณะกรรมการอาหารและยา หรือหน่วยงานที่เกี่ยวข้อง"}, {"id": "F9", "no": "9", "text": "โครงการอื่น ๆ ตามที่คณะกรรมการจริยธรรมการวิจัยเห็นชอบ"}]}, "typeIntro": {"exempt": "โครงการวิจัยที่เข้าข่ายการพิจารณาแบบยกเว้น (Exemption Review) หมายถึงโครงการวิจัยที่มีความเสี่ยงไม่เกินความเสี่ยงเล็กน้อย โดยเป็นโครงการที่มีลักษณะใดลักษณะหนึ่ง ดังนี้", "expedited": "โครงการวิจัยที่เข้าข่ายการพิจารณาแบบเร็ว (Expedited Review) หมายถึงโครงการวิจัยที่มีความเสี่ยงไม่เกินเล็กน้อย เป็นโครงการที่มีลักษณะใดลักษณะหนึ่ง ดังต่อไปนี้", "full": "โครงการวิจัยที่เข้าข่ายการพิจารณาแบบเต็มรูปแบบ (Full Board Review) หมายถึง โครงการวิจัยที่มีความเสี่ยงเกินความเสี่ยงเล็กน้อย เป็นโครงการที่มีลักษณะใดลักษณะหนึ่ง ดังต่อไปนี้"}, "qualify": ["ต้องเป็นงานวิจัย", "ต้องเป็นงานวิจัยที่มีขั้นตอนการเก็บรวบรวมข้อมูลจากคนโดยตรงหรือเก็บรวบรวมข้อมูลที่ไม่ปฏิสัมพันธ์กับคนโดยตรง แต่ข้อมูลสามารถเชื่อมโยงถึงตัวบุคคลได้", "ต้องเป็นงานวิจัยที่ผู้วิจัยยังไม่ได้เริ่มเก็บรวบรวมข้อมูลเพื่อตอบวัตถุประสงค์การวิจัย"], "principles": [{"no": "5.2.1.1", "title": "หลักความเคารพในบุคคล", "blocks": [{"lvl": 1, "kind": "lead", "text": "หลักความเคารพในบุคคล คือ การเคารพในศักดิ์ศรีความเป็นมนุษย์ ได้แก่"}, {"lvl": 1, "mark": "1)", "text": "เคารพในความสามารถตัดสินใจด้วยตนเองของแต่ละบุคคลโดยปราศจากการแทรกแซง ด้วยการขอความยินยอมโดยให้ข้อมูลอย่างครบถ้วนและให้บุคคลตัดสินใจอย่างอิสระปราศจากการข่มขู่ บังคับ ให้สินจ้างรางวัล หรือกดดันโดยวิธีต่าง ๆ"}, {"lvl": 1, "mark": "2)", "text": "เคารพในความเป็นส่วนตัวและการเก็บรักษาความลับของอาสาสมัคร"}, {"lvl": 1, "mark": "3)", "text": "เคารพในความเป็นบุคคลเปราะบาง"}]}, {"no": "5.2.1.2", "title": "หลักคุณประโยชน์", "blocks": [{"lvl": 1, "kind": "lead", "text": "หลักคุณประโยชน์ คือ การประเมินผลประโยชน์ที่ต้องมีจากการวิจัย โดยการประเมินประโยชน์ของอาสาสมัครที่เข้าร่วมโครงการวิจัยจะได้รับหรือประโยชน์ที่หน่วยงาน ชุมชนหรือสังคมจะได้รับ ซึ่งผู้วิจัยใช้ในการเพิ่มประโยชน์ต่ออาสาสมัครให้ได้มากที่สุด รวมถึงประเมินความเสี่ยงของอาสาสมัครที่เข้าร่วมโครงการวิจัยต้องแบกรับ พร้อมทั้งเสนอวิธีการหรือมาตรการลดความเสี่ยงต่ออาสาสมัครให้เหลือน้อยที่สุด"}]}, {"no": "5.2.1.3", "title": "หลักความยุติธรรม", "blocks": [{"lvl": 1, "kind": "lead", "text": "หลักความยุติธรรม คือ การกระจายภาระและประโยชน์ให้กับอาสาสมัครอย่างเป็นธรรม ไม่เลือกกลุ่มคนที่แบกรับภาระอยู่แล้วให้แบกเพิ่มโดยไม่สมควรหรือปฏิเสธประโยชน์อันเกิดจากการวิจัยแก่ผู้สมควรได้ นอกจากนี้ไม่เลือกบุคคลโดยลำเอียง มีวิธีการได้มาซึ่งอาสาสมัครที่สะท้อนถึงการกระจายประโยชน์และความเสี่ยงต่ออาสาสมัคร อย่างเท่าเทียมโดยไม่มีอคติหรือลำเอียง"}]}], "receive": ["เมื่อกรรมการได้รับการติดต่อจากสำนักงานให้ประเมินโครงการวิจัยให้กรรมการผู้ประเมินเบื้องต้น พิจารณาว่าสามารถประเมินโครงการวิจัยหรือสามารถเข้าร่วมประชุมพิจารณาโครงการวิจัยได้หรือไม่ และให้กรรมการผู้ประเมินเบื้องต้น ประเมินตนเองว่ามีผลประโยชน์ทับซ้อน (Conflict of Interest) กับโครงการวิจัยนั้นหรือไม่", "หากไม่สามารถประเมินได้ตามเวลาที่กำหนดหรือไม่สามารถเข้าร่วมนำเสนอในที่ประชุมได้หรือหากมีผลประโยชน์ทับซ้อน (Conflict of Interest) กับโครงการวิจัยนั้น ขอให้แจ้งเจ้าหน้าที่สำนักงานภายใน 1 วันทำการหลังจากได้รับการติดต่อจากเจ้าหน้าที่สำนักงาน เพื่อจะได้เปลี่ยนแปลงกรรมการผู้ประเมินเบื้องต้นเป็นท่านอื่นต่อไป", "หากสามารถประเมินได้ตามเวลาที่กำหนด หรือสามารถเข้าร่วมนำเสนอในที่ประชุมได้และไม่มีผลประโยชน์ทับซ้อน (Conflict of Interest) กับโครงการวิจัยนั้น ขอให้แจ้งเจ้าหน้าที่สำนักงานภายใน 1 วันทำการหลังจากได้รับการติดต่อจากเจ้าหน้าที่สำนักงาน", "ให้กรรมการผู้ประเมินเบื้องต้นตรวจสอบความครบถ้วนของเอกสารโครงการวิจัยที่ได้รับตามประเภทโครงการวิจัย หากเอกสารที่ได้รับไม่ครบถ้วน ให้แจ้งเจ้าหน้าที่สำนักงานภายใน 1 วันทำการ เพื่อจัดส่งเอกสารเพิ่มเติมให้ถูกต้อง และครบถ้วน", "กรณีโครงการวิจัยใหม่ที่ต้องมีแก้ไขหรือชี้แจงเพิ่มเติม ให้กรรมการและเลขานุการหรือกรรมการที่ได้รับมอบหมายตรวจสอบความครบถ้วนของเอกสารการแก้ไขหรือข้อชี้แจงเพิ่มเติมจากผู้วิจัย หากไม่ครบถ้วนให้แจ้งเจ้าหน้าที่สำนักงานภายใน 1 วันทำการ เพื่อจัดส่งเอกสารเพิ่มเติมให้ถูกต้องครบถ้วน"], "content": [{"no": "5.2.3.1", "title": "เหตุผลและความจำเป็นที่จะต้องศึกษาวิจัยในมนุษย์", "blocks": [{"lvl": 1, "kind": "lead", "text": "เหตุผลและความจำเป็นที่จะต้องศึกษาวิจัยในมนุษย์ ประโยชน์ทางวิชาการ ความเสี่ยงและประโยชน์ที่อาสาสมัครจะได้รับ โดยต้องพิจารณาในประเด็นต่อไปนี้"}, {"lvl": 1, "mark": "1)", "text": "การวิจัยในมนุษย์ทางคลินิกจะกระทำต่อเมื่อมีความจำเป็น และไม่สามารถกระทำในสัตว์ทดลองหรือห้องปฏิบัติการแทนได้ และจะต้องมีหลักฐานการวิจัยในสัตว์ทดลองหรือการวิจัยด้วยวิธีอื่น ที่แสดงว่าประสบผลสำเร็จตามสมควร และสมควรนำมาใช้กับมนุษย์ หรือ"}, {"lvl": 1, "mark": "2)", "text": "การวิจัยในมนุษย์จะกระทำต่อเมื่อคาดหมายได้ว่าจะเป็นผลดียิ่งกว่าการใช้วิธีการอย่างอื่น ๆ และมีหลักฐานแสดงว่าไม่ก่อให้เกิดความเสียหาย หรืออันตรายต่อสุขภาพของมนุษย์ หรือ"}, {"lvl": 1, "mark": "3)", "text": "หากเป็นการศึกษาที่เกี่ยวข้องกับเครื่องมือแพทย์ หรือเครื่องมืออื่น ๆ ที่นักวิจัยพัฒนาขึ้น เช่น เครื่องมือทางการเกษตร เครื่องมือทางอุตสาหกรรม ผู้วิจัยจะต้องประเมินว่าเครื่องมือดังกล่าวเป็นเครื่องมือที่มีความเสี่ยงมากหรือมีความเสี่ยงน้อยตามแบบประเมิน"}]}, {"no": "5.2.3.2", "title": "แง่มุมทางวิทยาศาสตร์ของระเบียบวิธีวิจัย", "blocks": [{"lvl": 1, "kind": "lead", "text": "แง่มุมทางวิทยาศาสตร์ของระเบียบวิธีวิจัย เช่น การออกแบบการศึกษา ขนาดตัวอย่างสำหรับงานวิจัยเชิงปริมาณหรือผู้ให้ข้อมูลสำหรับงานวิจัยเชิงคุณภาพ เกณฑ์การคัดเลือกอาสาสมัคร จุดยุติของโครงการวิจัย ขั้นตอนการปฏิบัติที่ใช้ในโครงการวิจัย และแผนการวิเคราะห์ข้อมูล โดยต้องพิจารณาในประเด็นต่อไปนี้"}, {"lvl": 1, "mark": "1)", "text": "การออกแบบการศึกษามีความเหมาะสมในการตอบคำถามโครงการวิจัยหรือบรรลุวัตถุประสงค์ของโครงการวิจัยหรือไม่"}, {"lvl": 1, "mark": "2)", "text": "จำนวนอาสาสมัครในโครงการวิจัยต้องมีเท่าที่จำเป็นและเหมาะสมกับระเบียบวิธีวิจัย โดยคำนึงถึงหลักความยุติธรรม"}, {"lvl": 1, "mark": "3)", "text": "มีเกณฑ์ในการคัดเลือกอาสาสมัครเข้าและออกจากโครงการวิจัย"}, {"lvl": 2, "mark": "(3.1)", "text": "อาสาสมัครกลุ่มที่น่าจะได้รับผลประโยชน์จากโครงการวิจัย หรือกลุ่มที่มีคุณสมบัติเหมาะสม ได้ถูกบรรจุในเกณฑ์การคัดเลือกอาสาสมัครอย่างปราศจากอคติ หรือการบังคับ"}, {"lvl": 2, "mark": "(3.2)", "text": "ในกรณีที่ต้องแบ่งกลุ่มอาสาสมัครต้องกระทำอย่างยุติธรรมและปราศจากอคติ"}, {"lvl": 2, "mark": "(3.3)", "text": "อาสาสมัครกลุ่มที่มีโอกาสเสี่ยงกับผลแทรกซ้อนจากโครงการวิจัยได้มากกว่าคนปกติหรือผู้ป่วยอื่น หรืออาสาสมัครที่ไม่มีคุณสมบัติเหมาะสมต่อการวิจัยได้ถูกคัดเลือกออก"}, {"lvl": 2, "mark": "(3.4)", "text": "การนำอาสาสมัครออกจากโครงการวิจัย/การถอนตัว (Withdrawal Criteria) ในโครงการวิจัยที่มีความเสี่ยงสูง ผู้วิจัยจะต้องมีการวางแผนที่จะหยุดการทดลองแก่อาสาสมัครในเวลาที่เหมาะสมเพื่อป้องกันไม่ให้เกิดความเสียหายแก่สุขภาพของอาสาสมัคร"}, {"lvl": 2, "mark": "(3.5)", "text": "หากมีอาสาสมัครกลุ่มเปราะบางรวมอยู่ด้วยผู้วิจัยจะต้องอธิบายเหตุผลความจำเป็นที่ต้องใช้อาสาสมัครกลุ่มนี้ อนึ่งบุคคลกลุ่มนี้ไม่ควรถูกนำเข้าร่วมการวิจัย หากการวิจัยนั้นไม่เกิดประโยชน์โดยตรงต่ออาสาสมัคร"}, {"lvl": 1, "mark": "4)", "text": "จุดยุติของโครงการวิจัย (Termination of Study Criteria) ในโครงการวิจัยที่มีความเสี่ยงสูง ผู้วิจัยและผู้สนับสนุนการวิจัยจะต้องมีการวางแผนยุติโครงการวิจัยก่อนกำหนด หากผลการวิเคราะห์ข้อมูลเบื้องต้น (Interim Analysis) พบว่าได้รับคำตอบที่ต้องการจากโครงการวิจัยแล้วหรือเกิดผลแทรกซ้อนร้ายแรงจากโครงการวิจัยมากกว่าที่คาดการณ์ไว้"}, {"lvl": 1, "mark": "5)", "text": "วิธีการทดลองที่ใช้กับอาสาสมัครกลุ่มทดลองและ/หรือกลุ่มควบคุม ที่ทำให้อาสาสมัครถูกรบกวน หรือได้รับอันตรายโดยไม่จำเป็น ผู้วิจัยซึ่งทำการทดลองจะต้องมีความรู้ความชำนาญเพียงพอที่จะดำเนินโครงการวิจัย"}, {"lvl": 1, "mark": "6)", "text": "เครื่องมือ วิธีทดสอบที่ใช้วัดผลการวิจัยมีความเหมาะสม ผู้ประเมินมีศักยภาพและความสามารถเพียงพอที่จะทำการประเมินผล ไม่มีผลประโยชน์ทับซ้อน (Conflict of Interests) ที่จะเกิดขึ้นต่อความน่าเชื่อถือของผลการทดลอง"}, {"lvl": 1, "mark": "7)", "text": "กรณีการเฝ้าระวังและติดตามผลแทรกซ้อนจากโครงการวิจัย ต้องมีวิธีการระยะเวลา สถานที่ที่ใช้ เครื่องมือ และทีมวิจัยที่เหมาะสม"}, {"lvl": 1, "mark": "8)", "text": "กรณีมีความจำเป็นต้องใช้เลือดหรือสิ่งส่งตรวจที่เก็บจากอาสาสมัครทั้งจำนวน ปริมาณ ความถี่ วิธีการเก็บต้องมีความเหมาะสม และหากต้องการใช้ประโยชน์ในอนาคตต้องระบุความจำเป็น"}, {"lvl": 1, "mark": "9)", "text": "สถิติหรือวิธีการที่ใช้ในการวิเคราะห์ข้อมูลมีความเหมาะสม"}]}, {"no": "5.2.3.3", "title": "การดูแลและคุ้มครองอาสาสมัคร", "blocks": [{"lvl": 1, "kind": "lead", "text": "การดูแลและคุ้มครองอาสาสมัคร โดยต้องพิจารณาในประเด็นต่อไปนี้"}, {"lvl": 1, "mark": "1)", "text": "มีระบุการรักษา ในกรณีที่เกิดอาการไม่พึงประสงค์ร้ายแรงจากการวิจัย"}, {"lvl": 1, "mark": "2)", "text": "มีการระบุผู้รับผิดชอบ หากมีค่าใช้จ่ายในการรักษาพยาบาลขณะเข้าร่วมโครงการวิจัย (ผู้ให้ทุนสนับสนุนโครงการวิจัย หรือผู้วิจัย หรือรัฐบาล หรืออาสาสมัคร)"}, {"lvl": 1, "mark": "3)", "text": "มีการระบุการชดเชย เช่น ค่าเดินทาง ค่าเสียเวลา (ถ้าเกี่ยวข้อง)"}, {"lvl": 1, "mark": "4)", "text": "มีการระบุการชดเชยในกรณีทุพลภาพหรือเสียชีวิต (ถ้าเกี่ยวข้อง)"}, {"lvl": 1, "mark": "5)", "text": "ในกรณีที่มีค่าตอบแทนการเข้าร่วมโครงการวิจัยให้แก่อาสาสมัคร ควรตรวจสอบไม่ให้มีจำนวนมากเกินไปจนกลายเป็นแรงจูงใจให้เข้าร่วมโครงการวิจัย หรือการจ่ายเป็นจำนวนมากในครั้งสุดท้ายครั้งเดียวจะเป็นการบีบบังคับให้อาสาสมัครเข้าร่วมการทดลองจนเสร็จ ซึ่งขัดกับหลักการให้อาสาสมัครสามารถถอนตัวออกจากการวิจัยได้อย่างอิสระตลอดเวลา"}, {"lvl": 1, "mark": "6)", "text": "มีการระบุประโยชน์ที่อาสาสมัครจะได้รับจากการเข้าร่วมโครงการวิจัย"}, {"lvl": 1, "mark": "7)", "text": "มีการระบุว่าอาสาสมัครจะได้รับทราบผลการวิจัยหรือไม่ อย่างไร (ถ้าเกี่ยวข้อง)"}, {"lvl": 1, "mark": "8)", "text": "หากการทดลองได้ผลดี ผู้วิจัยควรพิจารณาให้อาสาสมัครกลุ่มควบคุมจะได้รับการปฏิบัติแบบเดียวกันกับอาสาสมัครกลุ่มทดลองโดยไม่คิดมูลค่า"}, {"lvl": 1, "mark": "9)", "text": "ผู้วิจัยมีการตระหนักถึงความเป็นอยู่ที่ดีของอาสาสมัครมากกว่าผลประโยชน์ทางวิชาการและทางสังคม"}]}, {"no": "5.2.3.4", "title": "การให้ข้อมูลแก่อาสาสมัคร", "blocks": [{"lvl": 1, "kind": "lead", "text": "การให้ข้อมูลแก่อาสาสมัคร โดยต้องพิจารณาในประเด็นต่อไปนี้"}, {"lvl": 1, "mark": "1)", "text": "วิธีการเข้าถึงอาสาสมัครเพื่อชักชวนให้เข้าร่วมโครงการวิจัยมีความเหมาะสม"}, {"lvl": 1, "mark": "2)", "text": "เอกสารคำชี้แจงมีข้อมูลเกี่ยวกับโครงการวิจัยอย่างครบถ้วน และเพียงพอต่อการตัดสินใจโดยปราศจากการบังคับหรือเข้าร่วมด้วยความเกรงใจ ผลประโยชน์ที่ควรจะได้รับ ความเสี่ยงในการเข้าร่วมโครงการวิจัยของอาสาสมัคร ทางเลือกอื่นของการรักษาและสิทธิที่จะไม่เข้าร่วมโครงการวิจัยหรือเพิกถอนการยินยอมเข้าร่วมโครงการวิจัยเมื่อใดก็ได้ โดยปราศจากโทษ"}, {"lvl": 1, "mark": "3)", "text": "แหล่งข้อมูลที่อาสาสมัครสามารถสอบถามข้อมูลเพิ่มเติมเกี่ยวกับโครงการวิจัย ผู้วิจัยจะต้องให้ที่อยู่และเบอร์ติดต่อโดยตรงแก่อาสาสมัคร และเบอร์โทรศัพท์กรณีฉุกเฉิน ตลอด 24 ชั่วโมง"}, {"lvl": 1, "mark": "4)", "text": "แหล่งข้อมูลสำหรับอาสาสมัครเพื่อสอบถามสิทธิของการเป็นอาสาสมัครหรือต้องการร้องเรียนเกี่ยวกับโครงการวิจัย ต้องระบุที่อยู่และหมายเลขโทรศัพท์ของสำนักงานคณะกรรมการจริยธรรมการวิจัยในมนุษย์"}]}, {"no": "5.2.3.5", "title": "การปกป้องความเป็นส่วนตัวและการรักษาความลับของอาสาสมัคร", "blocks": [{"lvl": 1, "kind": "lead", "text": "การปกป้องความเป็นส่วนตัวและการรักษาความลับของอาสาสมัคร โดยต้องพิจารณาตั้งแต่ขั้นตอนการออกแบบการวิจัย การเก็บรวบรวมข้อมูล การนำเสนอผลการวิจัยรวม ทั้งการเผยแพร่งานวิจัย"}, {"lvl": 1, "mark": "1)", "text": "การปกป้องความเป็นส่วนตัว เช่น การใช้นามสมมติสำหรับอาสาสมัครหรือสถานศึกษา การไม่ถ่ายภาพหรือบันทึกวิดีทัศน์ (หากภาพถ่ายและวิดีทัศน์นั้นไม่จำเป็นต่อการวิเคราะห์ข้อมูล คณะกรรมการไม่อนุญาตให้ถ่ายภาพและวิดีทัศน์ หากมีความจำเป็นต่อการวิเคราะห์ข้อมูล ขอให้ชี้แจงต่อคณะกรรมการ) ในกรณีที่อาสาสมัครเป็นบุคคลที่มีชื่อเสียง และผู้วิจัยมีความจำเป็นต้องระบุชื่อจริงของอาสาสมัครดังกล่าว ขอให้จัดทำแบบชี้แจงสำหรับอาสาสมัครกลุ่มนี้โดยเฉพาะ เพื่อแจ้งให้รับทราบว่าจะมีการระบุชื่อจริงของอาสาสมัครในงานวิจัย บทความ หรือผลงานทางวิชาการในรูปแบบอื่น ๆ"}, {"lvl": 1, "mark": "2)", "text": "การรักษาความลับ เช่น การเก็บรักษาข้อมูลที่เก็บรวบรวมจากอาสาสมัครทั้งที่เป็นไฟล์อิเล็กทรอนิกส์และกระดาษไว้ในที่ปลอดภัย มีการใส่รหัสคอมพิวเตอร์และไฟล์ข้อมูล เก็บไว้ในตู้เก็บเอกสารที่มีกุญแจล็อคอย่างแน่นหนา การจำกัดจำนวนบุคคลที่เข้าถึงข้อมูล และทำลายข้อมูลที่เกี่ยวข้องภายหลังเสร็จสิ้นการวิจัย"}]}, {"no": "5.2.3.6", "title": "กระบวนการขอความยินยอม", "blocks": [{"lvl": 1, "text": "โครงการวิจัยที่เกี่ยวข้องกับมนุษย์ ผู้วิจัยต้องได้รับความยินยอมเป็นลายลักษณ์อักษรจากอาสาสมัครก่อนทำการทดลองหรือเก็บข้อมูลเสมอ แต่มีบางโครงการวิจัยที่ต้องได้รับการพิจารณาเป็นรายกรณี ดังนี้"}, {"lvl": 1, "mark": "1)", "text": "การยกเว้นขอความยินยอมจากอาสาสมัคร"}, {"lvl": 2, "mark": "(1.1)", "text": "โครงการวิจัยที่เกี่ยวข้องกับการรักษาในภาวะฉุกเฉิน และอาสาสมัครอยู่ในภาวะวิกฤติหรือไม่สามารถให้การยินยอมด้วยตนเอง ซึ่งจะต้องมีองค์ประกอบครบดังต่อไปนี้"}, {"lvl": 3, "mark": "(1.1.1)", "text": "การวิจัยนี้เกี่ยวข้องกับอาสาสมัครที่ตกอยู่ในภาวะวิกฤติและการรักษาที่มีอยู่ในปัจจุบันยังไม่ได้รับการพิสูจน์ หรือไม่มีประสิทธิภาพเพียงพอ แต่การรวบรวมข้อมูลอย่างถูกต้องตามหลักวิทยาศาสตร์ของโครงการวิจัยนี้ จะสามารถตอบคำถามในแง่ประสิทธิภาพและความปลอดภัยของการรักษาได้"}, {"lvl": 3, "mark": "(1.1.2)", "text": "การขอความยินยอมจากอาสาสมัครไม่สามารถกระทำได้เนื่องจากอาสาสมัครอยู่ในภาวะวิกฤติ และการวิจัยไม่สามารถรอการขอความยินยอมจากญาติหรือผู้แทนโดยชอบตามกฎหมายของอาสาสมัครเพื่อขอความยินยอมได้ทันในช่วงเวลาดังกล่าว"}, {"lvl": 3, "mark": "(1.1.3)", "text": "การนำอาสาสมัครที่ตกอยู่ในภาวะวิกฤติเข้าสู่โครงการวิจัยเป็นไปเพื่อประโยชน์โดยตรงต่ออาสาสมัคร"}, {"lvl": 3, "mark": "(1.1.4)", "text": "การวิจัยนี้ไม่สามารถกระทำได้หากไม่ได้รับอนุญาตให้ยกเว้นการขอความยินยอม"}, {"lvl": 3, "mark": "(1.1.5)", "text": "ต้องมีแผนการขอความยินยอมจากญาติหรือผู้แทนโดยชอบตามกฎหมายภายในหรือหลังจากผ่านช่วงระยะเวลาการรักษา (Therapeutic Window) ที่ชัดเจนและมีหลักฐานความพยายามในการติดต่อญาติหรือผู้แทนโดยชอบตามกฎหมายเพื่อรายงานความก้าวหน้าต่อคณะกรรมการ"}, {"lvl": 2, "mark": "(1.2)", "text": "การศึกษาทางด้านสังคมศาสตร์และพฤติกรรมศาสตร์บางประเด็นที่หากอาสาสมัครได้รับแจ้งข้อมูลการวิจัย อาจมีการเปลี่ยนแปลงพฤติกรรมทำให้ผลการวิจัยไม่เที่ยงตรง ทั้งนี้ผู้วิจัยจะต้องชี้แจงเหตุผลและแจ้งแนวทางการขอความยินยอม หรือการให้ข้อมูลอาสาสมัครเพื่อให้คณะกรรมการพิจารณาความเหมาะสมก่อน"}, {"lvl": 2, "mark": "(1.3)", "text": "โครงการวิจัยบางอย่าง ผู้วิจัยอาจขอยกเว้นการขอความยินยอมจากอาสาสมัครได้หากเข้าข่ายครบทุกกรณีดังต่อไปนี้"}, {"lvl": 3, "mark": "(1.3.1)", "text": "การวิจัยมีความเสี่ยงต่ออาสาสมัครไม่มากเกินกว่าความเสี่ยงที่อาสาสมัครจะได้รับในการดำเนินกิจวัตรประจำวัน และ"}, {"lvl": 3, "mark": "(1.3.2)", "text": "การขอยกเว้นการขอยินยอมไม่ส่งผลกระทบต่อสิทธิและความเป็นอยู่ที่ดีของอาสาสมัคร และ"}, {"lvl": 3, "mark": "(1.3.3)", "text": "การวิจัยไม่สามารถกระทำได้หากไม่ยกเว้นการขอความยินยอมจากอาสาสมัคร และ"}, {"lvl": 3, "mark": "(1.3.4)", "text": "การลงนามเป็นลายลักษณ์อักษรในเอกสารยินยอมของอาสาสมัครเป็นข้อมูลเดียวที่เชื่อมโยงถึงตัวบุคคลของอาสาสมัคร และมีความเสี่ยงที่จะทำให้อาสาสมัครตกอยู่ในภาวะอันตรายหากการเข้าร่วมการวิจัยได้รับการเปิดเผยความลับ"}, {"lvl": 1, "kind": "note", "text": "หมายเหตุ การขอยกเว้นความยินยอมจากอาสาสมัครไม่สามารถกระทำได้ หากเป็นโครงการวิจัยที่เกี่ยวข้องกับยาหรือเครื่องมือแพทย์ที่อยู่ในระหว่างการวิจัยเพื่อขอขึ้นทะเบียนยาของสำนักงานคณะกรรมการอาหารและยาของประเทศสหรัฐอเมริกา"}, {"lvl": 1, "mark": "2)", "text": "การขอความยินยอม ที่ไม่ต้องเป็นลายลักษณ์อักษร มีลักษณะดังต่อไปนี้"}, {"lvl": 2, "mark": "(2.1)", "text": "การวิจัยมีความเสี่ยงต่ออาสาสมัครไม่มากเกินกว่าความ ามยินยอมจากหญิงมีครรภ์ได้โดยตรง"}, {"lvl": 2, "mark": "(4.2)", "text": "หากการวิจัยมีความเสี่ยงต่อทารกในครรภ์มากกว่าความเสี่ยงเล็กน้อยและไม่มีประโยชน์ต่อสุขภาพของหญิงมีครรภ์หรือทารกในครรภ์ จะต้องขอความยินยอมจากหญิงมีครรภ์และบิดาโดยชอบด้วยกฎหมายของทารก (สามีของหญิงตั้งครรภ์)"}, {"lvl": 2, "mark": "(4.3)", "text": "หากหญิงมีครรภ์เป็นผู้เยาว์อายุต่ำกว่า 17 ปี ให้ขอความยินยอมจากบิดาหรือมารดาของหญิงมีครรภ์ด้วย"}, {"lvl": 1, "mark": "5)", "text": "การได้รับความยินยอมในกรณีที่อาสาสมัครเป็นผู้ไร้สมรรถภาพทางกฎหมายทุพลภาพทางร่างกายหรือทางจิตใจ ที่ไม่สามารถให้ความยินยอมด้วยตนเองได้ จะต้องได้รับความยินยอมจากผู้แทนโดยชอบธรรมตามกฎหมาย"}, {"lvl": 1, "mark": "6)", "text": "การขอความยินยอมในกรณีที่อาสาสมัครหรือผู้แทนโดยชอบธรรมอ่านหนังสือไม่ออก จะต้องมีบุคคลซึ่งไม่เกี่ยวข้องกับโครงการวิจัยและไม่อยู่ภายใต้อิทธิพลอันไม่เหมาะสมของผู้ที่เกี่ยวข้องกับการวิจัย (Impartial Witness) ทำหน้าที่อ่านเอกสารชี้แจงอาสาสมัคร แบบแสดงความยินยอม และเอกสารอื่นให้แก่อาสาสมัครรวมทั้งอยู่ร่วมเป็นสักขีพยานในระหว่างการขอความยินยอม"}]}], "submit": ["กรรมการพิจารณาให้ความเห็นประเด็นต่าง ๆ พร้อมแจ้งข้อคำถามหรือข้อแนะนำลงในแบบประเมิน", "ลงนามและวันที่พิจารณาเมื่อประเมินเสร็จสิ้นลงในแบบประเมิน", "ส่งเอกสารและแบบประเมินทั้งหมดไปยังสำนักงานภายในวันที่กำหนด", "กรณีที่กรรมการผู้ประเมินเบื้องต้นส่งผลการประเมินผ่านระบบออนไลน์หรืออีเมล ให้เจ้าหน้าที่ลงทะเบียนวันที่ได้รับผลการประเมินตามวันที่ได้รับทราบข้อมูล"], "defs": [{"term": "อาสาสมัครกลุ่มเปราะบาง (Vulnerable subjects)", "text": "บุคคลซึ่งอาจถูกชักจูง หรือถูกบีบบังคับให้เข้าร่วมการวิจัยได้โดยง่ายด้วยความคาดหวังว่าจะได้รับผลประโยชน์จากการเข้าร่วมโครงการวิจัย ไม่ว่าจะสมเหตุสมผลหรือไม่ก็ตามหรือเป็นผู้ที่ตอบตกลงเข้าร่วมการวิจัยเพราะเกรงกลัวว่าจะถูกกลั่นแกล้งจากผู้ที่มีอำนาจเหนือกว่าหากปฏิเสธ ได้แก่", "list": ["ทารก เด็กอายุต่ำกว่า 18 ปี", "สตรีมีครรภ์", "เด็กหรือผู้สูงอายุที่อยู่ในสถานสงเคราะห์", "ผู้สูงอายุตั้งแต่ 60 ปีขึ้นไป", "ผู้ที่อ่านเขียนไม่ได้", "ผู้ที่มีความบกพร่องในการตัดสินใจหรือความทรงจำ", "ผู้เสพหรือผู้ขายยาเสพติด", "ผู้ป่วยโรคติดต่อ เช่น HIV/AIDS โรควัณโรค
